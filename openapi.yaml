  /requirements/{id}/readiness:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    put:
      tags: [Requirements]
      summary: Record evidence for Story readiness checks
      description: Requires requirement.update in the persisted Story project. Reviews are revision checked and stamped with the authenticated reviewer, time, and content fingerprint. Content changes invalidate prior reviews. Ordinary Story saves cannot create or replace these reserved reviews.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_revision, checks]
              properties:
                expected_revision: { type: integer, minimum: 1 }
                checks:
                  type: object
                  minProperties: 1
                  maxProperties: 10
                  description: Keys are persona_value, acceptance_criteria, wireframe, dependencies, story_points, acceptance_tests, code_review, automated_tests, critical_defects, or product_owner.
                  additionalProperties:
                    type: object
                    required: [status, evidence]
                    properties:
                      status: { type: string, enum: [met, not_met, unverified] }
                      evidence: { type: string, maxLength: 2000, description: A nonblank evidence note is required for a reviewed status. }
                      attachment_id: { type: string, description: Required for a met wireframe check; must belong to this Story. }
      responses:
        "200":
          description: Saved review and incremented Story revision
          content:
            application/json:
              schema:
                type: object
                required: [updated, revision]
                properties:
                  updated: { type: boolean }
                  revision: { type: integer, minimum: 1 }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }

