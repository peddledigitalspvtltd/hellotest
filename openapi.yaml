                prompt_guidance: { type: string, maxLength: 12000 }
                additional_context: { type: string, maxLength: 12000, description: User-reviewed supporting evidence }
                proposed_change: { type: object, additionalProperties: true, description: Current unsaved artifact draft }
                assurance_baseline: { type: object, additionalProperties: true, description: Deterministic scores and dimensions; the provider returns narrative only }
      responses:
        "200": { description: Evidence graph and optional cited assurance_review narratives with deterministic scores preserved; fallback_reason explains provider failures }
  /executions/{id}/ai-failure-clusters:
    parameters:
      - $ref: "#/components/parameters/IdParam"
