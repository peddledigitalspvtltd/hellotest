  /test-cases:
    get:
      tags:
        - Test Cases
      summary: List Test Cases with bounded catalog pagination
      description: Set include_page=true for the first 25 records, then use next_cursor. The main catalog uses a stable
        activity/id cursor; module and Suite scopes retain their membership order. Cursors are scoped to the filters.
        Summary projection omits large authoring JSON. Use include_total=false when metrics are fetched separately. Legacy
        requests without include_page or cursor return an array. Picker projection always returns at most 25 compact choices with a stable keyset cursor, including Suite/module scopes. It omits authoring bodies, step/execution counts, and execution history; total is omitted unless include_total=true. Membership display metadata is resolved only for the returned page.
      parameters:
        - $ref: "#/components/parameters/ProjectIdQuery"
        - name: review_queue
          in: query
          description: Show pending manual and AI reviews assigned to the authenticated user. Always returns a bounded page; cursors cannot cross reviewers. An explicit reviewer takes precedence over legacy AI creator fallback.
          schema: { type: string, enum: [mine] }
        - $ref: "#/components/parameters/SuiteIdQuery"
        - $ref: "#/components/parameters/RequirementIdQuery"
        - $ref: "#/components/parameters/AppTypeIdQuery"
        - name: module_id
          in: query
          schema:
            type: string
        - name: unassigned_module
          in: query
          description: Only Test Cases outside modules; ignored when module_id is supplied.
          schema:
            type: boolean
        - $ref: "#/components/parameters/StatusQuery"
        - $ref: "#/components/parameters/PriorityQuery"
        - name: search
          in: query
          description: Literal case-insensitive search across the full scoped catalog, including module, Story, Suite and reviewer
            metadata.
          schema:
            type: string
        - name: workflow_status
          in: query
          description: Derived library status. Execution-derived states require include_execution=true.
          schema:
            type: string
            enum:
              - ai-generated
              - draft
              - pending-review
              - active
              - ready
              - automated
              - retired
              - passed
              - failed
        - name: step_filter
          in: query
          schema:
            type: string
            enum:
              - with-steps
              - no-steps
        - name: run_filter
          in: query
          description: Applied only with include_execution=true.
          schema:
            type: string
            enum:
              - with-runs
              - no-runs
        - name: exclude_automated
          in: query
          description: Omit independent automated cases from the manual library.
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/CatalogIncludeExecutionQuery"
        - $ref: "#/components/parameters/CatalogPageSizeQuery"
        - $ref: "#/components/parameters/CatalogCursorQuery"
        - $ref: "#/components/parameters/CatalogIncludePageQuery"
        - $ref: "#/components/parameters/CatalogIncludeTotalQuery"
        - name: projection
          in: query
          schema: { type: string, enum: [summary, detail, picker] }
          description: Picker automatically pages and caps page_size at 25. Execution and step evidence filters are ignored for this projection.
        - name: ids
          in: query
          schema: { type: string }
          description: Up to 200 comma-separated exact IDs for preselected labels. Intersects project/app and other filters; an empty list matches nothing. Results remain paginated.
        - name: suite_ids
          in: query
          schema: { type: string }
          description: Up to 200 comma-separated Suite IDs. Matches any current or legacy membership without expanding descendants.
        - name: automated
          in: query
          schema: { type: string, enum: ['yes', 'no'] }
        - name: label
          in: query
          schema: { type: string }
        - name: shared_step_group_id
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Test Cases or a bounded catalog page.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/TestCase"
                  - $ref: "#/components/schemas/TestCasePage"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
    post:
      tags: [Test Cases]
      summary: Create test case
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTestCaseRequest"
      responses:
        "200":
          description: Test case created
          content:
