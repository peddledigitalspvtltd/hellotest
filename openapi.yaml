  /admin-portal/setup/sample-data:
    get:
      tags: [Admin Portal]
      summary: Read module sample coverage and installation state
      description: Returns the repository-owned dataset catalog with its version, authored date, manifest hash and file count, feature examples, dependencies, feature availability, and exact installed/expected record counts. Includes role presets with canonical permission_codes, current_permission_codes, role_id, and installed/customized/not_installed status. Requires a workspace administrator.
      security:
        - bearerAuth: []
      responses:
        "200": { description: "Catalog containing version, project_id, modules, roles, and connected-service notes." }
        "401": { description: Authentication required. }
        "403": { description: Workspace administrator access required. }
        "409": { description: Repository setup files or their manifest are missing, invalid or inconsistent. }
    post:
      tags: [Admin Portal]
      summary: Queue repository-backed instance setup
      description: Queues a durable background job and returns immediately. Files are validated and processed in dependency order, with a transaction per file, bounded retries and saved checkpoints. Existing records, customized role grants, user assignments and feature settings are retained. Omit modules to install all modules; an explicit empty selection is rejected. If setup is already active, returns that active job. No external services or test executions are started. Poll the status endpoint until every file is verified and the job completes.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                modules:
                  type: array
                  minItems: 1
                  maxItems: 64
                  items:
                    type: string
                    enum: [workspace_roles, workspace, planning, design, environments, issues, execution, knowledge, automation, agents, dashboards, integrations, testops]
      responses:
        "202":
          description: Setup queued, or the current active setup returned. This response does not mean installation has completed.
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceSetupSnapshot'
        "400": { description: Invalid or empty module selection. }
        "401": { description: Authentication required. }
        "403": { description: Workspace administrator access required. }
        "409": { description: Repository dataset metadata or dependency declarations are invalid. }
        "503": { description: The API is restarting; retry setup shortly. }
  /admin-portal/setup/sample-data/status:
    get:
      tags: [Admin Portal]
      summary: Read durable instance setup progress
      description: Returns a requested setup job, or the active job followed by the most recently updated job when job_id is omitted. If no job has ever been created, job is null and running is false. Failed jobs retain their completed file checkpoints and an actionable error. Requires a workspace administrator.
      security:
        - bearerAuth: []
      parameters:
        - name: job_id
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "200":
          description: Current durable setup progress and optional verified result.
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceSetupSnapshot'
        "400": { description: Invalid job ID. }
        "401": { description: Authentication required. }
        "403": { description: Workspace administrator access required. }
        "404": { description: The requested setup job does not exist. }
  /admin-portal/setup/sample-data/{jobId}/retry:
    post:
      tags: [Admin Portal]
      summary: Resume a failed instance setup
      description: Requeues a failed job against the same manifest hash and preserves its completed file checkpoints. The installer rechecks saved identities before skipping files and restores missing rows without overwriting existing data. An active or completed job is returned unchanged. If the dataset changed, start a new setup instead. Requires a workspace administrator.
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              maxProperties: 0
      responses:
        "202":
          description: Failed setup requeued, or the active/completed job returned unchanged.
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceSetupSnapshot'
        "400": { description: Invalid job ID or unexpected retry parameters. }
        "401": { description: Authentication required. }
        "403": { description: Workspace administrator access required. }
        "404": { description: Setup job not found. }
        "409": { description: Another setup is active, or the repository manifest changed; preserve current data and start a new setup when appropriate. }
        "503": { description: The API is restarting; retry setup shortly. }
