      - { name: level, in: path, required: true, schema: { type: string, enum: [suites, modules, cases] } }
      - { name: scopeId, in: path, required: true, schema: { type: string } }
    put:
      tags: [Executions]
      summary: Set or clear an inherited suite, module, or case assignment
      description: Assignments cannot change after the run has finished.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateExecutionAssignmentRequest"
      responses:
        "200": { description: Scope assignment updated and effective case assignments recalculated }
        "409": { description: Run has finished or expected_revision is stale. }
