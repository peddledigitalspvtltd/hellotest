      responses:
        "200": { description: Evidence-linked failure clusters with an explicit unclassified group }
  /ai/quality-insights:
    get:
      tags: [Quality Analytics]
      summary: Preview project or release-scoped quality insights
      description: >-
        Requires the insight grant and every returned manual source's view grant and
        feature policy before any evidence read. Automation coverage is omitted when
        automation analytics is unavailable. Returns project, scope, release_summary
        and insights with finding-specific evidence references, while preserving legacy
        summary/findings aliases. Per-run counts use latest run/case/data-row attempts;
        legacy advisory confidence fields are heuristics, not measured probabilities.
      parameters:
        - $ref: "#/components/parameters/ProjectIdQuery"
        - { name: release, in: query, schema: { type: string } }
        - { name: sprint, in: query, schema: { type: string } }
      responses:
        "200": { description: "Release readiness metrics, findings, limitations, and provenance" }
  /ai/rich-text-rephrase:
    post:
      tags: [Quality Analytics]
      summary: Rephrase a project-scoped rich-text authoring field with the configured LLM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, content]
              properties:
                project_id: { type: string }
                content: { type: string, maxLength: 20000 }
                content_html: { type: string, maxLength: 40000 }
                entity_type: { type: string }
                entity_title: { type: string }
                field_label: { type: string }
                aria_label: { type: string }
                additional_context: { type: string, maxLength: 12000, description: Human-reviewed untrusted Smart Context used only to preserve relevant terminology and constraints. }
      responses:
        "200":
          description: Sanitized allowlisted HTML plus integration and human-review provenance
  /feedback/ai-draft-preview:
    post:
      tags: [Defects]
      summary: Create a review-only defect draft from bounded HelloTest evidence
      responses:
        "200": { description: "Evidence-linked draft, confidence, provenance, and human-review requirement" }
  /issues/ai-draft-preview:
    post:
      tags: [Defects]
      summary: Alias for the review-only defect drafting endpoint
      responses:
        "200": { description: "Evidence-linked draft, confidence, provenance, and human-review requirement" }
  /feedback:
    get:
      tags:
        - Defects
      summary: List Defects visible to the current user
      description: Project-scoped access requires feedback.view. Set include_page=true for a bounded database page of 25
        records by default. Cursors preserve creation-time precision and are tied to the current filters. Use
        include_total=false with the metrics endpoint to omit a repeated full-scope count. Without include_page or cursor,
        the legacy array response remains available.
      parameters:
        - $ref: "#/components/parameters/ProjectIdQuery"
        - name: user_id
          in: query
          description: Reporter identifier.
          schema:
            type: string
        - $ref: "#/components/parameters/StatusQuery"
        - name: priority
          in: query
          schema:
            type: string
        - name: assignee_id
          in: query
          description: Assignee identifier, or __unassigned__ for Defects without an assignee.
          schema:
            type: string
        - name: q
          in: query
          description: Literal case-insensitive search across Defect details, people, delivery context and linked run metadata.
          schema:
            type: string
        - $ref: "#/components/parameters/CatalogPageSizeQuery"
        - $ref: "#/components/parameters/CatalogCursorQuery"
        - $ref: "#/components/parameters/CatalogIncludePageQuery"
        - $ref: "#/components/parameters/CatalogIncludeTotalQuery"
        - $ref: "#/components/parameters/CatalogProjectionQuery"
      responses:
        "200":
          description: Defects or a bounded catalog page.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/Issue"
                  - $ref: "#/components/schemas/IssuePage"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
    post:
      tags: [Defects]
      summary: Create a Defect with optional delivery and traceability context
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateIssueRequest" }
      responses:
        "200":
          description: Defect created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssueCreatedResponse" }
  /feedback/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      tags: [Defects]
      summary: Read a Defect
      responses:
        "200":
          description: Defect record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
    put:
      tags: [Defects]
      summary: Update a Defect, including its delivery and traceability context
      requestBody:
        required: true
