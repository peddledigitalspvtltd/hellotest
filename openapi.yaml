  /execution-results/{id}/attachments:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      tags: [Evidence]
      summary: List files belonging to one case result and data iteration
      description: Requires result.view and attachment.view for the result's project. Earlier run-level files keep their original execution scope.
      responses:
        "200":
          description: Durable attachment metadata without embedded file content
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ExecutionResultAttachment" }
    post:
      tags: [Evidence]
      summary: Upload case or step evidence to object storage
      description: Requires result.manage and attachment.create. Replacing step evidence also requires attachment.delete. Uploading does not start a case or change its status or timer, including finished runs. Text-like files use transparent gzip storage; media and archives retain their bytes. Step metadata and its attachment record commit together. Earlier replaced files remain available as case attachments.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: Non-empty supported evidence file; at most 25 MB and within the configured storage limit. }
                step_id: { type: string, description: Optional frozen step belonging to this case run. Omit for a case attachment. }
                expected_revision: { type: integer, minimum: 1, description: Optimistic result revision for a step evidence change. }
      responses:
        "200":
          description: File metadata and the resulting result revision
          content:
            application/json:
              schema:
                type: object
                properties:
                  attachment: { $ref: "#/components/schemas/ExecutionResultAttachment" }
                  revision: { type: integer }
                  evidence: { type: object, description: For a step upload, the saved attachmentId/name/MIME/size/checksum metadata. No file bytes are embedded. }
        "400": { description: Missing or unsupported file, or a step outside this case run }
        "403": { description: Required project permission is missing }
        "409": { description: Result revision changed during the upload; the uploaded object is discarded }
        "413": { description: File exceeds the upload limit }
  /execution-results/{id}/attachments/{attachmentId}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
      - { name: attachmentId, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Evidence]
      summary: Delete a case-result attachment and its current step reference
      description: Requires result.manage and attachment.delete. The file must belong to this exact result; another case's attachment cannot be deleted through this path. Status and timer values are unchanged.
      responses:
        "200": { description: Deleted attachment ID and resulting result revision }
        "403": { description: Required project permission is missing }
        "404": { description: Attachment does not belong to this result }
  /attachments/meta:
    get:
      tags: [Evidence]
      summary: Read object-storage attachment capabilities
      responses:
        "200":
          description: Attachment provider and upload limit
  /attachments:
    get:
      tags: [Evidence]
      summary: List attachments for a project-scoped HelloTest record
      parameters:
        - $ref: "#/components/parameters/ProjectIdQuery"
        - { name: entity_type, in: query, required: true, schema: { type: string, enum: [requirement, test_case, test_suite, shared_step_group, execution, execution_result, issue] } }
        - { name: entity_id, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Attachment metadata; binary bodies are loaded only from the download endpoint
    post:
