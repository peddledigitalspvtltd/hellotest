openapi: 3.0.3
info:
  title: HelloTest API
  version: 1.1.0
  description: |
    OpenAPI specification for the current HelloTest Fastify + PostgreSQL backend.
    This spec documents the implemented CRUD resources, request payloads,
    query filters, and the execution lifecycle actions.
servers:
  - url: http://localhost:3000
    description: Local development server
security:
  - bearerAuth: []
  - apiKeyAuth: []
tags:
  - name: Auth
  - name: Admin Portal
  - name: Settings
  - name: Feature Flags
  - name: Users
  - name: Roles
  - name: Projects
  - name: Project Members
  - name: App Types
  - name: Integrations
  - name: Requirements
  - name: Releases
  - name: Defects
  - name: Test Suites
  - name: Test Cases
  - name: Test Case Modules
  - name: Test Steps
  - name: Shared Step Groups
  - name: Test Environments
  - name: Test Configurations
  - name: Test Data
  - name: Executions
  - name: Execution Schedules
  - name: Execution Results
  - name: Evidence
  - name: Quality Analytics
  - name: Automation
  - name: Knowledge
  - name: Notifications
  - name: Operations
  - name: Workspace Transactions
  - name: Test Engine
paths:
  /auth/setup:
    get:
      tags: [Auth]
      summary: Read the available sign-in and email-verification providers
      security: []
      responses:
        "200":
          description: Public authentication provider availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSetupResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /auth/signup/request-code:
    post:
      tags: [Auth]
      summary: Request an email verification code for a new account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "200":
          description: Verification code accepted for delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationDispatchResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /auth/signup/verify:
    post:
      tags: [Auth]
      summary: Verify the signup code and create the account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificationCodeRequest"
      responses:
        "200":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/ErrorResponse"
  /auth/login:
    post:
      tags: [Auth]
      summary: Login and return a signed session token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /auth/login/google:
    post:
      tags: [Auth]
      summary: Sign in or create an account using a Google identity token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleLoginRequest"
      responses:
        "200":
          description: Session payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "502":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /auth/forgot-password/request-code:
    post:
      tags: [Auth]
      summary: Request an email code for a password reset
      description: Returns a successful response for unknown email addresses to avoid account enumeration.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetCodeRequest"
      responses:
        "200":
          description: Password-reset request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationDispatchResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /auth/forgot-password/verify:
    post:
      tags: [Auth]
      summary: Verify the password-reset code and replace the password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificationCodeRequest"
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/ErrorResponse"
  /auth/session:
    get:
      tags: [Auth]
      summary: Resolve the current session from a Bearer token
      security:
        - bearerAuth: []
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          description: Bearer token returned by the auth endpoints.
      responses:
        "200":
          description: Session payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"

  /settings/localization:
    get:
      tags: [Settings]
      summary: Read workspace localization overrides
      responses:
        "200":
          description: Localization string overrides
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalizationSettingsResponse" }
    put:
      tags: [Settings]
      summary: Replace workspace localization overrides
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateLocalizationSettingsRequest" }
      responses:
        "200":
          description: Updated localization string overrides
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdatedLocalizationSettingsResponse" }
  /settings/workspace-preferences:
    get:
      tags: [Settings]
      summary: Read personal preferences merged with governed workspace policy
      description: Governed preference keys are stored once for the workspace and are returned identically to every authenticated user; all other keys remain personal to the current user.
      responses:
        "200":
          description: Personal preferences plus governed AI prompt, LLM selection, metric criteria, and metric formula preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspacePreferencesResponse" }
    put:
      tags: [Settings]
      summary: Merge personal preferences or update governed workspace policy
      description: Governed AI prompt, LLM selection, and metric criteria keys require AI prompt administration; governed metric formula values require workspace preference administration. Other serializable keys update only the current user's preferences.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateWorkspacePreferencesRequest" }
      responses:
        "200":
          description: Merged workspace preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdatedWorkspacePreferencesResponse" }
  /settings/api-keys:
    get:
      tags: [Settings]
      summary: List the current user's scoped API keys and available scopes
      security:
        - bearerAuth: []
      responses:
        "200":
          description: API key metadata; secret values are never returned by list operations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyListResponse" }
    post:
      tags: [Settings]
      summary: Create a scoped API key and return its secret once
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateApiKeyRequest" }
      responses:
        "200":
          description: Created API key metadata and one-time secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateApiKeyResponse" }
  /settings/api-keys/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    delete:
      tags: [Settings]
      summary: Revoke an API key while retaining its audit metadata
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Revoked API key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevokeApiKeyResponse" }
  /settings/api-keys/{id}/permanent:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    delete:
      tags: [Settings]
      summary: Permanently delete an API key owned by the current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: API key permanently deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PermanentDeleteApiKeyResponse" }
  /feature-flags:
    get:
      tags: [Feature Flags]
      summary: Read grouped feature definitions and effective local flags
      description: |
        Returns one consistent workspace policy snapshot. No project selection is
        required. Local values preserve administrator intent; effective flags
        also reflect parent capability dependencies. Requires workspace.view.
      responses:
        "200":
          description: Feature flag snapshot
          headers:
            Cache-Control:
              description: Workspace feature policy must not be cached by intermediaries.
              schema: { type: string, enum: ["private, no-store"] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeatureFlagSnapshot" }
    put:
      tags: [Feature Flags]
      summary: Apply a partial update to local feature flag values
      description: |
        Requires feature_flag.manage and the Administration feature. Every key
        must be a known feature key and every value must be a boolean. Omitted
        flags retain their persisted values. Updates to different keys merge
        atomically; concurrent changes to the same key use the last committed
        value. The policy update and its audit record commit together.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateFeatureFlagsRequest" }
      responses:
        "200":
          description: Updated effective feature flag snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeatureFlagSnapshot" }
        "400":
          description: Invalid request. Unknown keys or non-boolean flag values return INVALID_FEATURE_FLAGS and reject the entire update.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeatureFlagErrorResponse" }
        "403":
          description: ACCESS_DENIED for a missing grant, or FEATURE_DISABLED when Administration is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeatureFlagErrorResponse" }

  /users:
    get:
      tags: [Users]
      summary: List users
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      tags: [Users]
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "200":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /users/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      tags: [Users]
      summary: Get user by ID
      responses:
        "200":
          description: User record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "500":
          $ref: "#/components/responses/ErrorResponse"
    put:
      tags: [Users]
      summary: Update user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Update result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdatedResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
    delete:
      tags: [Users]
      summary: Delete user
      responses:
        "200":
          description: Delete result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"

  /roles:
    get:
      tags: [Roles]
      summary: List roles
      responses:
        "200":
          description: List of roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
    post:
      tags: [Roles]
      summary: Create role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleRequest"
      responses:
        "200":
          description: Role created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /roles/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      tags: [Roles]
      summary: Get role by ID
      responses:
        "200":
          description: Role record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
    put:
      tags: [Roles]
      summary: Update role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleRequest"
      responses:
        "200":
          description: Update result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdatedResponse"
    delete:
      tags: [Roles]
      summary: Delete role
      responses:
        "200":
          description: Delete result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedResponse"

  /projects:
    get:
      tags: [Projects]
      summary: List projects
      parameters:
        - name: projection
          in: query
          description: Summary returns compact project metadata without cross-project counts. Fetch an individual project for its full description and portfolio analytics for metrics.
          schema: { type: string, enum: [summary, detail], default: detail }
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      tags: [Projects]
      summary: Create project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "200":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResponse"
  /projects/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      tags: [Projects]
      summary: Get project by ID
      responses:
        "200":
          description: Project record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    put:
      tags: [Projects]
      summary: Update project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Update result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdatedResponse"
    delete:
      tags: [Projects]
      summary: Queue durable project deletion
      description: |
        Requires project.delete for an existing project. Repeated requests return
        the same job; failed jobs can be explicitly retried. Database deletion is
        atomic and stored-file cleanup continues after commit. The original
        requester or an administrator can retry cleanup after the project is gone.
      responses:
        "202":
          description: Deletion accepted; poll the Location endpoint for completion
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [accepted, job]
                properties:
                  accepted: { type: boolean, enum: [true] }
                  job: { $ref: "#/components/schemas/ProjectDeletionJob" }

  /projects/{id}/deletion:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      tags: [Projects]
      summary: Read project deletion progress
      description: Available to the original requester, administrators, or users with current project.delete access. Remains available after the project is deleted.
      responses:
        "200":
          description: Durable job state; only completed means database and external cleanup finished
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectDeletionJob" }
        "404":
          description: No visible deletion job exists

  /project-members:
    get:
      tags: [Project Members]
      summary: List project members
      parameters:
        - $ref: "#/components/parameters/ProjectIdQuery"
        - $ref: "#/components/parameters/UserIdQuery"
        - $ref: "#/components/parameters/RoleIdQuery"
      responses:
        "200":
          description: List of project memberships
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectMember"
    post:
      tags: [Project Members]
      summary: Create project member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectMemberRequest"
      responses:
        "200":
          description: Membership created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResponse"
  /project-members/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      tags: [Project Members]
      summary: Get project member by ID
      responses:
        "200":
          description: Project member record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"
    put:
      tags: [Project Members]
      summary: Update project member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectMemberRequest"
      responses:
        "200":
          description: Update result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdatedResponse"
    delete:
      tags: [Project Members]
      summary: Delete project member
      responses:
        "200":
          description: Delete result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedResponse"

  /app-types:
    get:
      tags: [App Types]
      summary: List app types
      parameters:
        - $ref: "#/components/parameters/ProjectIdQuery"
      responses:
        "200":
          description: List of app types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppType"
    post:
      tags: [App Types]
      summary: Create app type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAppTypeRequest"
      responses:
        "200":
          description: App type created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResponse"
  /app-types/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      tags: [App Types]
      summary: Get app type by ID
      responses:
        "200":
          description: App type record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppType"
    put:
      tags: [App Types]
      summary: Update app type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAppTypeRequest"
      responses:
        "200":
          description: Update result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdatedResponse"
    delete:
      tags: [App Types]
      summary: Delete app type
      responses:
        "200":
          description: Delete result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedResponse"

  /requirements/metrics:
    get:
      tags:
        - Requirements
      summary: Get complete Story, Backlog and Sprint catalog metrics
      description: Aggregates the matching project scope independently of loaded record pages. Requires requirement.view.
        include_sprints=true additionally requires requirement_iteration.view and includes Sprint health; otherwise
        sprint_health is empty. include_execution=true requires run.view and result.view; unavailable execution counts
        and rates remain null. Coverage includes distinct direct and mapped Test Case links; Release scope includes membership records. Filter choices cover the project rather than only the loaded page.
      parameters:
        - $ref: "#/components/parameters/CatalogIncludeExecutionQuery"
        - name: project_id
          in: query
          required: true
          description: Project whose metrics are requested.
          schema:
            type: string
        - $ref: "#/components/parameters/StatusQuery"
        - $ref: "#/components/parameters/PriorityQuery"
        - name: sprint_id
          in: query
          description: Native Sprint identifier.
          schema:
            type: string
        - name: unassigned
          in: query
          description: Only Stories with neither a native Sprint nor a nonempty imported Sprint name.
          schema:
            type: boolean
        - name: search
          in: query
          description: Literal case-insensitive search across all matching Stories and their linked metadata, applied before pagination.
          schema:
            type: string
        - name: sprint
          in: query
          description: Imported Sprint value or native Sprint name.
          schema:
            type: string
        - name: label
          in: query
          schema:
            type: string
        - name: fix_version
          in: query
          schema:
            type: string
        - name: release
          in: query
          schema:
            type: string
        - name: coverage
          in: query
          description: Filter by the presence of linked Test Cases.
          schema:
            type: string
            enum:
              - linked
              - unlinked
        - name: include_sprints
          in: query
          description: Include Sprint health. Execution aggregates additionally require include_execution=true.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Complete filtered catalog metrics and project filter choices.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementCatalogMetricsResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
  /test-cases/review-summary:
    get:
      tags: [Test Cases]
      summary: Count pending Test Cases assigned to the signed-in reviewer
      description: Requires project-scoped testcase.view. Counts manual pending reviews and pending AI drafts, independent of catalog search, modules and pagination. Legacy unassigned AI drafts belong to their creator. Reviewer identity always comes from the authenticated session.
      parameters:
        - $ref: "#/components/parameters/ProjectIdQuery"
        - $ref: "#/components/parameters/AppTypeIdQuery"
      responses:
        "200":
          description: Pending reviews in the requested project/application scope.
          content:
            application/json:
              schema:
                type: object
                required: [pending]
                properties:
                  pending: { type: integer, minimum: 0 }
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
  /test-cases/metrics:
    get:
      tags:
        - Test Cases
      summary: Get complete Test Case catalog and module metrics
      description: One request returns complete catalog coverage, quality metrics, and health for every module and unassigned
        cases. Requires testcase.view for the resolved project; project_id or app_type_id is required for non-admin callers.
        include_execution=true additionally requires run.view and result.view. Execution aggregates use the latest ten
        results per Test Case and the latest finalized outcome per case; when omitted, execution-derived values are zero or
        null.
      parameters:
        - $ref: "#/components/parameters/ProjectIdQuery"
        - $ref: "#/components/parameters/AppTypeIdQuery"
        - name: review_queue
          in: query
          description: Restrict metrics to pending manual and AI reviews assigned to the authenticated user.
          schema: { type: string, enum: [mine] }
        - name: exclude_automated
          in: query
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/CatalogIncludeExecutionQuery"
      responses:
        "200":
          description: Catalog metrics independent of record pagination.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestCaseCatalogMetricsResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
  /feedback/metrics:
    get:
      tags:
        - Defects
      summary: Get complete Defect catalog metrics
      description: Aggregates every Defect matching the project, visibility and search filters without loading individual
        records. Requires feedback.view for project-scoped requests. Non-admin callers must supply project_id.
      parameters:
        - $ref: "#/components/parameters/ProjectIdQuery"
        - name: user_id
          in: query
          description: Reporter identifier.
          schema:
            type: string
        - $ref: "#/components/parameters/StatusQuery"
        - name: priority
          in: query
          schema:
            type: string
