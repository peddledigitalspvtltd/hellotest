          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeAssistantMessageResponse" }
        "202":
          description: An identical client turn is already being processed; retry after the response header delay.
          headers:
            Retry-After:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeAssistantMessageResponse" }
  /knowledge/assistant/sessions/{id}/messages/stream:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    post:
      tags: [Knowledge]
      summary: Stream safe retrieval progress and the validated final answer
      description: Authenticated POST SSE emits progress, result, and error events. Disconnect cancels work. Retry the same client_turn_id to resume or replay safely.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateKnowledgeAssistantMessageRequest" }
      responses:
        "200":
          description: RetrievalEvent progress followed by KnowledgeAssistantMessageResponse result or structured error
          content:
            text/event-stream:
              schema: { type: string }
  /v1/context/retrieve:
    post:
      tags: [Knowledge]
      summary: Retrieve a bounded authorized ContextPacket without answer generation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContextRetrievalRequest" }
      responses:
        "200":
          description: Canonical ContextPacket version 1.0; authorization comes from the authenticated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeContextPacket" }
  /v1/context/retrieve-stream:
    post:
      tags: [Knowledge]
      summary: Stream authorized context retrieval progress and a final ContextPacket
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContextRetrievalRequest" }
      responses:
        "200":
          description: RetrievalEvent progress followed by ContextPacket result or structured error
          content:
            text/event-stream:
              schema: { type: string }
  /knowledge/sources/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      tags: [Knowledge]
      summary: Inspect visible source fragments, provenance, and index readiness
      parameters:
        - in: query
          name: revision_id
          schema: { type: string }
          description: Historical revision selection requires knowledge.manage.
        - in: query
          name: as_of
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Authorized source, revision, visible fragments, and canonical KnowledgeObject
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
    delete:
      tags: [Knowledge]
      summary: Archive a source immediately and retain revision history
      responses:
        "200":
          description: Tombstoned source with retained history and index cleanup status
  /knowledge/sources/{id}/revisions:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      tags: [Knowledge]
      summary: List authorized revision history with effective intervals (knowledge.manage required)
      responses:
        "200":
          description: Source revision history
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /knowledge/sources/{id}/security:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    put:
      tags: [Knowledge]
      summary: Replace source, revision, or fragment security bindings
      description: Requires knowledge.manage. Explicit DENY takes precedence over explicit ALLOW, inherited DENY, and inherited ALLOW. Target fragments and revisions must belong to the source.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bindings]
              properties:
                bindings:
                  type: array
                  maxItems: 250
                  items:
                    type: object
                    required: [principal_type, principal_id, effect]
                    properties:
                      principal_type: { type: string, enum: [USER, ROLE, PROJECT, EVERYONE] }
                      principal_id: { type: string }
                      effect: { type: string, enum: [ALLOW, DENY] }
                      inherited: { type: boolean }
                      document_id: { type: string }
                      chunk_id: { type: string }
      responses:
        "200":
          description: Updated security policy
  /ops-telemetry/console-session/{provider}:
    post:
      tags: [Operations]
      summary: Start an embedded Jaeger or Alertmanager browser session
      security:
        - bearerAuth: []
      description: Requires a workspace administrator with project access. Issues a provider-scoped encrypted HttpOnly cookie for read-only inspection. Traces default to the API service in the last hour.
      parameters:
        - in: path
          name: provider
          required: true
          schema: { type: string, enum: [traces, alerts] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id]
              properties:
                project_id: { type: string, maxLength: 128 }
      responses:
        '200':
          description: Same-origin console URL and session expiry
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                  expires_at: { type: string, format: date-time }
        '403': { description: Administrator browser session required }
        '503': { description: Console unavailable or disabled }
  /ops-telemetry/console/{provider}/*:
    get:
      tags: [Operations]
      summary: Read an embedded monitoring console resource
      security:
        - traceConsoleSession: []
        - alertConsoleSession: []
      description: Accepts only the matching provider cookie. Revalidates the administrator and project for every request; forwards only allowlisted reads. Silence creation, deletion, archives, and arbitrary proxy destinations are not supported.
      parameters:
        - in: path
          name: provider
          required: true
          schema: { type: string, enum: [traces, alerts] }
      responses:
        '200': { description: Console HTML, assets, or read API data }
        '401': { description: Missing or expired session }
        '403': { description: Permission denied or disallowed resource }
        '502': { description: Upstream unavailable }
  /ops-telemetry/grafana-session:
    post:
      tags: [Operations]
      summary: Start a protected read-only Grafana browser session
      security:
        - bearerAuth: []
      description: Requires a signed-in workspace administrator and project access. Sets a short-lived HttpOnly cookie. Grafana credentials never leave the backend.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id]
              properties:
                project_id: { type: string }
      responses:
        '200':
          description: Same-origin dashboard URL and session expiration
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                  expires_at: { type: string, format: date-time }
        '403': { description: Administrator browser session required }
        '503': { description: Grafana is unavailable or not configured }
    delete:
      tags: [Operations]
      summary: Clear the embedded Grafana browser session
      responses:
        '200': { description: Browser session cookie expired }
  /ops-telemetry/grafana/*:
    get:
      tags: [Operations]
      summary: Read a protected Grafana dashboard resource
      security:
        - grafanaBrowserSession: []
      description: Requires the encrypted HttpOnly session cookie. Revalidates the administrator and project on every request. Only allowlisted dashboard, static asset and read API paths are forwarded using a dedicated Viewer account.
      responses:
        '200': { description: Dashboard HTML, assets or read-only API data }
        '401': { description: Missing or expired dashboard session }
        '403': { description: Permission denied or path not allowed }
        '502': { description: Grafana unavailable }
    post:
      tags: [Operations]
      summary: Run a read-only embedded dashboard query
      security:
        - grafanaBrowserSession: []
      description: Requires the dashboard session cookie and matching Origin. Restricted to provisioned Prometheus, Loki and Jaeger datasource queries; writes and arbitrary proxy destinations are rejected.
      responses:
        '200': { description: Datasource query results }
        '204': { description: Frontend instrumentation acknowledged locally }
        '401': { description: Missing or expired dashboard session }
        '403': { description: Permission or origin denied }
        '502': { description: Grafana unavailable }
  /ops-telemetry/platform:
    get:
      tags: [OPS telemetry]
      summary: Read bounded monitoring component health
      description: Requires project access and ops.view. Returns partial component availability without exposing provider addresses or credentials.
      parameters:
        - in: query
          name: project_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Cached monitoring snapshot; unavailable components do not fail the response.
          content:
            application/json:
              schema:
                type: object
                required: [checked_at, enabled, state, components, policy]
                properties:
                  checked_at: { type: string, format: date-time }
                  enabled: { type: boolean }
                  state: { type: string, enum: [available, degraded, not_configured] }
                  components:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        purpose: { type: string }
                        state: { type: string }
                        memory_limit_mib: { type: integer }
                        latency_ms: { type: integer }
                  policy: { type: object, additionalProperties: { type: string } }
  /ops-telemetry/monitoring/{section}:
    get:
      tags: [Operations]
      summary: Read the infrastructure dashboard, recent container logs, or Alertmanager alerts
      description: Requires workspace administrator access, project access, and ops.view. Fixed bounded queries are cached for 15 seconds. A failed data source returns unavailable without affecting other views.
      parameters:
        - { in: path, name: section, required: true, schema: { type: string, enum: [dashboard, logs, alerts] } }
        - { in: query, name: project_id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Monitoring data or an explicit unavailable/not_configured state. Logs cover the last 15 minutes, capped at 100 lines; alerts are capped at 100.
          content:
            application/json:
              schema:
                type: object
                required: [section, checked_at, state]
                properties:
                  section: { type: string, enum: [dashboard, logs, alerts] }
                  checked_at: { type: string, format: date-time }
                  state: { type: string, enum: [available, unavailable, not_configured] }
                  metrics: { type: array, items: { type: object } }
                  services: { type: array, items: { type: object } }
                  logs: { type: array, maxItems: 100, items: { type: object } }
                  alerts: { type: array, maxItems: 100, items: { type: object } }
                  limit: { type: integer }
                  window: { type: string }
        '400': { description: Missing project or unsupported monitoring section }
        '401': { description: Authentication required }
        '403': { description: Workspace administrator and project access required }
  /ops-telemetry/snapshot:
    get:
      tags: [Operations]
      summary: Read a project-scoped, server-authenticated OPS telemetry snapshot
      description: The API injects the configured OPS credential server-side so browser clients never receive provider secrets. The provider must acknowledge the selected project scope for both events and service aggregates.
      parameters:
        - { in: query, name: project_id, required: true, schema: { type: string } }
        - { in: query, name: include_workers, description: Include a separate bounded list of shared TestEngine queue events. Requires workspace administrator access., schema: { type: boolean, default: false } }
        - { in: query, name: service_name, schema: { type: string, maxLength: 200 } }
        - { in: query, name: event_type, schema: { type: string, maxLength: 200 } }
        - { in: query, name: status, schema: { type: string, maxLength: 200 } }
        - { in: query, name: execution_id, schema: { type: string, maxLength: 200 } }
        - { in: query, name: search, schema: { type: string, maxLength: 200 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 250, default: 100 } }
      responses:
        "200":
          description: Redacted telemetry events and service aggregates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpsTelemetrySnapshot" }
        "400": { description: Missing project scope }
        "403": { description: Project permission denied }
        "502": { description: OPS provider rejected the request or did not acknowledge project scope }
        "503": { description: OPS provider is unavailable or not securely configured }
  /ops-telemetry/logs:
    delete:
      tags: [Operations]
      summary: Delete project OPS telemetry logs through the configured provider
      description: Requires project scope and uses the provider's dedicated project deletion route. Other projects and unscoped service events are retained.
      parameters:
        - { in: query, name: project_id, required: true, schema: { type: string } }
      responses:
        "200":
          description: Telemetry logs deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  cleared: { type: boolean }
                  deleted: { type: integer, minimum: 0 }
                  events_path: { type: string }
        "400": { description: Missing project scope }
        "403": { description: Project permission denied }
        "502": { description: OPS provider does not support the scoped operation }
  /admin-portal/integrations/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Admin Portal]
      summary: Delete admin portal integrations
      security:
        - bearerAuth: []
      responses:
        "200": { description: Successful response }
  /repository-inspection/capabilities:
    get:
      tags: [Automation]
      summary: Read the project's browser inspection connection options
      description: Requires project membership and automation.view. Remote availability reflects configured Test Engine access; it is not a browser health probe.
      parameters:
        - { name: project_id, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Remote configuration and local-agent protocol information
          content:
            application/json:
              schema:
                type: object
                properties:
                  remote:
                    type: object
                    properties:
                      available: { type: boolean }
                      reason: { type: string, nullable: true }
                  local:
                    type: object
                    properties:
                      base_url: { type: string, format: uri }
                      setup_requires_checkout: { type: boolean }
                      setup_endpoint: { type: string }
                      protocol_version: { type: integer }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /repository-inspection/sessions:
    post:
      tags: [Automation]
      summary: Start an isolated remote Object Repository browser
      description: Requires a browser login, project membership and automation.repository.manage. Uses the project's active Test Engine integration and returns app-relative proxy URLs with a two-hour session capability. Does not require the separate recorder or execution features.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id]
              properties:
                project_id: { type: string }
                app_type_id: { type: string }
                start_url: { type: string, format: uri, description: HTTP(S) target without embedded credentials. Private remote destinations require an administrator-configured exact-host allowlist. }
      responses:
        "200":
          description: Protected inspection session; internal Test Engine URLs and credentials are omitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string }
                  purpose: { type: string, enum: [repository-inspect] }
                  recorder_mode: { type: string, enum: [remote] }
                  started_at: { type: string, format: date-time }
                  expires_at: { type: string, format: date-time }
                  start_url: { type: string, nullable: true }
                  status_url: { type: string }
                  live_view_url: { type: string }
                  display_mode: { type: string }
                  capture: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /repository-inspection/local-agent/setup:
    post:
      tags: [Automation]
      summary: Prepare a paired local inspection agent installer
      description: Requires automation.repository.manage and a browser login. The application origin must match the request origin. The generated link expires in ten minutes and revalidates the originating login and project permission when downloaded.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, origin, agent_token]
              properties:
                project_id: { type: string }
                origin: { type: string, format: uri, description: Exact HTTP(S) application origin with no path. }
                agent_token: { type: string, pattern: '^[a-zA-Z0-9_-]{32,128}$', writeOnly: true }
      responses:
        "200":
          description: Time-limited installer download
          content:
            application/json:
              schema:
                type: object
                properties:
                  download_url: { type: string }
                  expires_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /repository-inspection/local-agent/download:
    get:
      tags: [Automation]
      summary: Download the paired Node.js local inspection installer
      description: Uses the ten-minute setup capability, revalidates its originating login and automation.repository.manage, and serves the runtime bundled with the API. No remote Test Engine is required. The installer requires Node.js 20 and npm and installs Playwright Chromium without a repository checkout.
      security:
        - inspectionCapability: []
      responses:
        "200":
          description: Private paired installer, served as an attachment with no-store caching
          content:
            text/javascript:
              schema: { type: string }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /repository-inspection/sessions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Automation]
      summary: Read protected browser inspection session status
      description: Revalidates the capability's originating login, owner, project membership and repository permission on every request.
      security:
        - inspectionCapability: []
        - inspectionCapabilityHeader: []
      responses:
        "200":
          description: Session status with internal engine URLs and tokens removed
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /repository-inspection/sessions/{id}/*:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Automation]
      summary: Read a protected inspection browser resource
      description: The wildcard is restricted to live, stream, screenshot, tabs and inspect/result. Each request revalidates the original login and repository permission. Live view allows framing by the paired app origin; stream uses server-sent events.
      security:
        - inspectionCapability: []
        - inspectionCapabilityHeader: []
      parameters:
        - { name: page_id, in: query, schema: { type: string } }
        - { name: embedded, in: query, schema: { type: string } }
        - { name: parent_origin, in: query, schema: { type: string } }
        - { name: parent_frame, in: query, schema: { type: string } }
        - { name: refresh, in: query, schema: { type: string } }
      responses:
        "200":
          description: Live HTML, screenshot, tab/capture JSON or screenshot event stream
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
            text/html:
              schema: { type: string }
            text/event-stream:
              schema: { type: string }
            image/jpeg:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "405": { $ref: "#/components/responses/ErrorResponse" }
    post:
      tags: [Automation]
      summary: Control the protected inspection browser
      description: The wildcard is restricted to tabs/activate, input, inspect/start, inspect/stop, inspect/validate, highlight, stop, pause and resume. Every operation revalidates the original login, owner, project and repository permission. The Test Engine validates each operation payload.
      security:
        - inspectionCapability: []
        - inspectionCapabilityHeader: []
      parameters:
        - { name: page_id, in: query, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Browser operation result
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "405": { $ref: "#/components/responses/ErrorResponse" }
  /repository-agents:
    get:
      tags: [Agents]
      summary: List repository agents and compiler availability
      responses:
        "200":
          description: Agent catalog, source limits and runtime readiness
  /repository-agents/runs:
    get:
      tags: [Agents]
      summary: List project-scoped repository analyses with bounded pagination
      parameters:
        - { in: query, name: project_id, required: true, schema: { type: string } }
        - { in: query, name: app_type_id, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Twenty summaries per page with total and has_more
    post:
      tags: [Agents]
      summary: Queue a persistent analysis from a ZIP or pinned GitHub source
      description: Requires agentic_workflow.run. Saved GitHub connections also require integration.view. Source commands are never executed. Idempotency-Key prevents duplicate submissions.
      parameters:
        - { in: header, name: Idempotency-Key, schema: { type: string, maxLength: 160 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, agent_type, source]
              properties:
                project_id: { type: string }
                app_type_id: { type: string }
                agent_type: { type: string, enum: [object_repository, api_tests, repository_knowledge, component_tests] }
                source:
                  type: object
                  required: [type, repository_url]
                  properties:
                    type: { type: string, enum: [github] }
                    repository_url: { type: string, format: uri }
                    ref: { type: string }
                    integration_id: { type: string }
          multipart/form-data:
            schema:
              type: object
              required: [project_id, agent_type, file]
              properties:
                project_id: { type: string }
                app_type_id: { type: string }
                agent_type: { type: string, enum: [object_repository, api_tests, repository_knowledge, component_tests] }
                file: { type: string, format: binary, description: Source ZIP up to 20 MB }
      responses:
        "202":
          description: Durable run receipt and Location header
        "409":
          description: Idempotency key reused with different input
        "429":
          description: Three analyses for this user and project are already active
  /repository-agents/runs/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      tags: [Agents]
      summary: Read progress, evidence, review findings and publication receipt
      responses:
        "200":
          description: Run with queued, running, completed, partial, failed or cancelled status
  /repository-agents/runs/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    post:
      tags: [Agents]
      summary: Cancel queued or active analysis without publishing findings
      responses:
        "200":
          description: Current run receipt
  /repository-agents/runs/{id}/retry:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    post:
      tags: [Agents]
      summary: Create a new analysis receipt for a failed or cancelled run
      responses:
        "202":
          description: New queued run using the saved archive or resolved repository revision
  /repository-agents/runs/{id}/publish:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    post:
      tags: [Agents]
      summary: Publish up to fifty reviewed findings into existing application stores
      description: Requires agent run permission plus the destination permission. Existing object names and locators are preserved. Test cases are drafts. Knowledge documents enter the durable indexing queue.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item_ids]
              properties:
                item_ids: { type: array, minItems: 1, maxItems: 50, uniqueItems: true, items: { type: string } }
                module_id: { type: string, description: Optional test module in the run application; requires testcase.update }
      responses:
        "200":
          description: Published destination links, skipped count and reasons
  /repository-agents/runs/{id}/artifacts/{name}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
      - { in: path, name: name, required: true, schema: { type: string } }
    get:
      tags: [Agents]
      summary: Download a generated review artifact
      responses:
        "200":
          description: Attachment served as a download and never executed in the app origin
  /agentic-workflows/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Automation]
      summary: Delete agentic workflows
      responses:
        "200": { description: Successful response }
    get:
      tags: [Automation]
      summary: Read agentic workflows
      responses:
        "200": { description: Successful response }
    put:
      tags: [Automation]
      summary: Update agentic workflows
      responses:
        "200": { description: Successful response }
  /ai-prompt-templates/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Automation]
      summary: Delete ai prompt templates
      responses:
        "200": { description: Successful response }
    put:
      tags: [Automation]
      summary: Update ai prompt templates
      responses:
        "200": { description: Successful response }
  /feedback/bulk-delete:
    delete:
      tags: [Defects]
      summary: Delete feedback bulk delete
      responses:
        "200": { description: Successful response }
  /projects/{id}/favorite:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
