        "200": { description: "Schema readiness, table counts, and roles.created/roles.retained arrays of role IDs and names." }
  /admin-portal/setup/performance-indexing:
    get:
      tags: [Admin Portal]
      summary: Read shared database performance indexing progress
      description: Requires a workspace administrator. Returns the fixed index catalog, the latest persisted job and whether an indexing worker holds the database lock. Interrupted jobs can be retried.
      security:
        - bearerAuth: []
      responses:
        "200": { description: "Indexing state with running, catalog, and job fields; responses are not cached." }
        "403": { description: Workspace administrator access is required }
    post:
      tags: [Admin Portal]
      summary: Build missing performance indexes without blocking normal writes
      description: Requires a workspace administrator and accepts no parameters. Starts an audited asynchronous job using a fixed index catalog and concurrent PostgreSQL index builds. Repeated requests return the active job; valid equivalent indexes are retained and failed index builds can be retried.
      security:
        - bearerAuth: []
      responses:
        "202": { description: "The indexing job was started or an existing job is running; poll GET for progress and per-index results." }
        "400": { description: Caller-supplied parameters are not supported }
        "403": { description: Workspace administrator access is required }
  /admin-portal/users:
    post:
      tags: [Admin Portal]
      summary: Execute admin portal users
      security:
        - bearerAuth: []
      responses:
        "200": { description: Successful response }
  /agentic-assistant/sessions:
    get:
      tags: [Automation]
      summary: List saved specialist reviews in a project
      description: Requires project membership and agentic_workflow.view in the selected project; transaction.view is not required. Only specialist review transactions are returned, with optional application filtering. The limit defaults to 20 and is capped at 100.
      security:
        - bearerAuth: []
      parameters:
        - { name: project_id, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
        - { name: app_type_id, in: query, schema: { type: string, maxLength: 255 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200": { description: Array of scoped specialist review transactions }
        "400": { description: A project is required and the optional application must belong to it }
        "403": { description: Project membership or agentic workflow view permission is missing }
    post:
      tags: [Automation]
      summary: Create an evidence-backed specialist review
      description: Read-only review with a 70-second session deadline, parallel bounded context retrieval, model retry, source citations, and explicit evidence readiness. Requires agentic_workflow.run in the selected project. This endpoint does not apply suggested changes.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, prompt]
              properties:
                project_id: { type: string }
                app_type_id: { type: string, nullable: true }
                mode: { type: string, enum: [chat, agent] }
                agent_id: { type: string }
                prompt: { type: string, maxLength: 8000 }
                context_scopes: { type: array, items: { type: string } }
                integration_id: { type: string, nullable: true }
                smart_context:
                  type: object
                  properties:
                    query: { type: string, maxLength: 2000 }
                    source_ids: { type: array, maxItems: 100, items: { type: string } }
                    source_kinds: { type: array, maxItems: 20, items: { type: string } }
                    reviewed_context: { type: string, maxLength: 12000 }
      responses:
        "200": { description: Successful response }
        "403": { description: Project membership or agentic workflow run permission is missing }
        "504": { description: The review exceeded its bounded session deadline }
  /agentic-assistant/sessions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Automation]
      summary: Restore a saved specialist review
      description: Returns the persisted transaction, events, result, citations, guardrails, and provenance independently of recent-history pagination. Requires project membership and agentic_workflow.view in the actual owning project. The result is null for running, failed, or unavailable outcomes; session_state and message explain the current state.
      security:
        - bearerAuth: []
      responses:
        "200": { description: Saved review envelope, including honest in-progress or unavailable state }
        "403": { description: Project membership or agentic workflow view permission is missing }
        "404": { description: No specialist review exists for this ID }
  /agentic-workflows/{id}/runs:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [Automation]
      summary: Save a workflow graph preview
      description: Validates a directed acyclic graph and stores a topological preview with execution_mode set to preview. Nodes are previewed with zero execution attempts. No model, tool, expression, API, or project mutation is executed.
      responses:
        "200": { description: Successful response }
        "400": { description: The graph is empty, cyclic, exceeds limits, or has invalid connections }
  /agentic-workflows/{id}/readiness:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Automation]
      summary: Check whether the saved workflow can execute an evidence review
      description: Requires agentic_workflow.view in the workflow project. Returns ready, node-specific blockers, warnings, ordered steps and execution limits. Only manual graphs with one trigger, one to four registered specialists, optional append aggregators, and output steps can execute.
      responses:
        "200": { description: Readiness report for the saved definition }
        "403": { description: The project permission or feature is unavailable }
  /agentic-workflows/{id}/executions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [Automation]
      summary: Execute a bounded specialist review workflow
      description: Requires agentic_workflow.run in the workflow project. Persists an immutable definition before executing registered specialists against permitted evidence. Runs have a three-minute deadline, at most eight steps and four specialists, and no external write actions. Reusing request_id with the same workflow and input returns the saved run. Existing graph previews remain available at the runs endpoint.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                request_id: { type: string, minLength: 8, maxLength: 128, pattern: '^[a-zA-Z0-9_-]+$' }
                input_payload: { type: object, description: JSON object limited to 16 KB }
      responses:
        "202": { description: Persisted review execution; poll the workflow run endpoint for actual results }
        "400": { description: Input is invalid or exceeds its limit }
        "403": { description: The project permission or feature is unavailable }
        "409": { description: The request ID was already used with a different definition or input }
        "422": { description: The definition is not ready for real review execution }
        "429": { description: This worker already has two active review workflows }
  /agentic-workflow-runs/{id}/cancel:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [Automation]
      summary: Stop a running specialist workflow while retaining completed reviews
      description: Requires agentic_workflow.run in the actual run project. Cancellation is persisted before active work is interrupted and cannot be overwritten by late completion. Preview records cannot be cancelled; a terminal review returns its current state.
      responses:
        "200": { description: Current workflow execution state }
        "403": { description: The project permission or feature is unavailable }
        "409": { description: This record is a graph preview }
  /agentic-workflows/api-agent-test:
    post:
      tags: [Automation]
      summary: Test an API endpoint in an authorized project
      description: Requires explicit project membership and agentic_workflow.run permission in that project before sending an HTTP request. Response previews are bounded and credentials are redacted; redirects are not followed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, url]
              properties:
                project_id: { type: string, minLength: 1, maxLength: 255 }
                url: { type: string }
                method: { type: string, enum: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS] }
                body: { type: string }
                auth: { type: string }
                credential: { type: object }
                responseStyle: { type: string, enum: [json, items, text, binary] }
      responses:
        "200": { description: Successful response }
        "400": { description: A valid project and API request are required }
        "403": { description: Project membership or run permission is missing }
