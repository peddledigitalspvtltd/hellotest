  /execution-results:
    get:
      tags: [Execution Results]
      summary: List execution results
      parameters:
        - name: projection
          in: query
          description: Summary omits logs, captured row data and lifecycle history for list/history views. Use the detail projection (default) or fetch an individual result for full evidence.
          schema:
            type: string
            enum: [summary, detail]
            default: detail
        - $ref: "#/components/parameters/ProjectIdQuery"
        - $ref: "#/components/parameters/ExecutionIdQuery"
        - $ref: "#/components/parameters/TestCaseIdQuery"
        - $ref: "#/components/parameters/AppTypeIdQuery"
