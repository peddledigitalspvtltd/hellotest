              type: object
              required: [expected_revision, options]
              properties:
                expected_revision: { type: integer, minimum: 0 }
                default_value: { type: string, nullable: true, maxLength: 120 }
                options:
                  type: array
                  maxItems: 200
                  items:
                    $ref: '#/components/schemas/DropdownOptionInput'
      responses:
        '200':
          description: Updated catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DropdownCatalog'
        '400':
          description: Invalid or duplicate options, disabled default, or system-managed field
        '401':
          description: Authentication required
        '403':
          description: Administrator access required
        '404':
          description: Unregistered field
        '409':
          description: Catalog revision changed; reload before publishing
