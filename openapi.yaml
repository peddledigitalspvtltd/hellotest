      summary: Stream one attachment to MinIO-compatible object storage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [project_id, entity_type, entity_id, file]
              properties:
                project_id: { type: string }
                entity_type: { type: string }
                entity_id: { type: string }
                file: { type: string, format: binary }
      responses:
        "200":
          description: Stored attachment metadata
