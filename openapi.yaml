          in: query
          description: Restrict evidence to the most recent scoped runs (maximum 500).
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: limit
          in: query
          description: Maximum result records returned (maximum 5,000).
          schema:
            type: integer
            minimum: 1
            maximum: 5000
      responses:
        "200":
          description: List of execution results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExecutionResult"
    post:
      tags: [Execution Results]
      summary: Create execution result
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExecutionResultRequest"
      responses:
        "200":
          description: Execution result created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevisionCreatedResponse"
  /execution-results/ensure:
    post:
      tags: [Execution Results]
      summary: Ensure an evidence holder without starting a case or changing an existing result
      description: Requires result.manage. Frozen case and data-row identity are validated. May create an unexecuted evidence holder on a finished run, but never changes an existing status, attempt or timer.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExecutionCaseIdentity" }
      responses:
        "200":
          description: Existing or newly created pending result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecutionResult" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /execution-results/lifecycle:
    post:
      tags: [Execution Results]
      summary: Explicitly transition a manual case and its persisted active timer
      description: Requires result.manage and run.execute. Start and resume require a running parent run; finished runs reject every lifecycle action. Repeated actions are idempotent. Reset retains the old attempt and creates a pending attempt; starting a finalized case creates a new attempt. Dataset metadata is resolved from the frozen run scope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ExecutionCaseIdentity"
                - type: object
                  required: [action]
                  properties:
                    action: { type: string, enum: [start, resume, pause, abort, block, skip, reset, pass, fail] }
                    expected_revision: { type: integer, minimum: 1 }
                    expected_result_id: { type: string, description: Current attempt ID; stale attempt mutations return 409. }
      responses:
        "200":
          description: Current persisted result including timer and lifecycle history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecutionResult" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /execution-results/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      tags: [Execution Results]
      summary: Get execution result by ID
      responses:
        "200":
          description: Execution result record
          content:
            application/json:
              schema:
