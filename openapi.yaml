        created_at: { type: string }
    RequirementDefectMapping:
      type: object
      properties:
        requirement_id: { type: string }
        issue_id: { type: string }
        link_source:
          type: string
          enum: [manual, automatic]
        created_at: { type: string }
    CreateRequirementRequest:
      type: object
      required: [project_id, title]
      properties:
        project_id: { type: string }
        title: { type: string }
        description: { type: string }
        external_references:
          type: array
          items: { type: string }
        labels:
          type: array
          items: { type: string }
        sprint: { type: string }
        fix_version: { type: string }
        release: { type: string }
        priority: { type: integer }
        status: { type: string }
    UpdateRequirementRequest:
      type: object
      properties:
        project_id: { type: string }
        title: { type: string }
        description: { type: string }
        external_references:
          type: array
          items: { type: string }
        labels:
          type: array
          items: { type: string }
        sprint: { type: string }
        fix_version: { type: string }
        release: { type: string }
        priority: { type: integer }
        status: { type: string }
    ReplaceRequirementDefectsRequest:
      type: object
      required: [requirement_id, issue_ids]
      properties:
        requirement_id: { type: string }
        issue_ids:
          type: array
          items: { type: string }
    BulkImportRequirementsRequest:
      type: object
      required: [project_id, rows]
      properties:
        project_id: { type: string }
        rows:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              description: { type: string }
              external_references:
                type: array
                items: { type: string }
              labels:
                type: array
                items: { type: string }
              sprint: { type: string }
              fix_version: { type: string }
              release: { type: string }
              priority: { type: integer }
              status: { type: string }
    BulkImportRequirementsResponse:
      type: object
      properties:
        imported: { type: integer }
        failed: { type: integer }
        created:
          type: array
          items:
            type: object
            properties:
              row: { type: integer }
              id: { type: string }
              title: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              row: { type: integer }
              title: { type: string, nullable: true }
              message: { type: string }
    TestSuite:
      type: object
      properties:
        id: { type: string }
        app_type_id: { type: string }
        name: { type: string }
        parent_id: { type: string, nullable: true }
        created_at: { type: string }
    CreateTestSuiteRequest:
      type: object
      required: [app_type_id, name]
      properties:
        app_type_id: { type: string }
        name: { type: string }
        parent_id: { type: string }
    UpdateTestSuiteRequest:
      type: object
      properties:
        name: { type: string }
        parent_id: { type: string }
    TestCase:
      type: object
      properties:
        id: { type: string }
        suite_id: { type: string }
        title: { type: string }
        description: { type: string, nullable: true }
        automated: { type: string, enum: [yes, no] }
        automation_status: { type: string, enum: [not_automated, ready, incomplete] }
        manual_test_case_id: { type: string, nullable: true, description: Primary manual test case linked to this independent automation case. }
        manual_test_case_ids: { type: array, items: { type: string }, description: All manual test cases linked to this automation case. }
        authoring_mode: { type: string, enum: [structured, gherkin] }
        gherkin_document: { type: string, nullable: true }
        priority: { type: integer, nullable: true }
        status: { type: string, nullable: true }
        requirement_id: { type: string, nullable: true }
        created_at: { type: string }
    CreateTestCaseRequest:
      type: object
      required: [suite_id, title]
      properties:
        suite_id: { type: string }
        title: { type: string }
        description: { type: string }
        automated: { type: string, enum: [yes, no] }
        automation_status: { type: string, enum: [not_automated, ready, incomplete] }
        manual_test_case_id: { type: string, nullable: true }
        manual_test_case_ids: { type: array, items: { type: string } }
        authoring_mode: { type: string, enum: [structured, gherkin] }
        gherkin_document: { type: string, nullable: true }
        priority: { type: integer }
        status: { type: string }
        requirement_id: { type: string }
    UpdateTestCaseRequest:
      type: object
      properties:
        suite_id: { type: string }
        title: { type: string }
        description: { type: string }
        automated: { type: string, enum: [yes, no] }
        automation_status: { type: string, enum: [not_automated, ready, incomplete] }
        manual_test_case_id: { type: string, nullable: true }
        manual_test_case_ids: { type: array, items: { type: string } }
        authoring_mode: { type: string, enum: [structured, gherkin] }
        gherkin_document: { type: string, nullable: true }
        priority: { type: integer }
        status: { type: string }
        requirement_id: { type: string }
    TestStep:
      type: object
      properties:
        id: { type: string }
        test_case_id: { type: string }
        step_order: { type: integer }
        action: { type: string, nullable: true }
        expected_result: { type: string, nullable: true }
    CreateTestStepRequest:
      type: object
      required: [test_case_id, step_order]
      properties:
        test_case_id: { type: string }
        step_order: { type: integer }
        action: { type: string }
        expected_result: { type: string }
    UpdateTestStepRequest:
      type: object
      properties:
        test_case_id: { type: string }
        step_order: { type: integer }
        action: { type: string }
        expected_result: { type: string }
    AnyObject:
      type: object
      additionalProperties: true
    StringMap:
      type: object
      additionalProperties:
        type: string
    IntegrationType:
      type: string
      enum: [llm, jira, email, google_auth, google_drive, github, testengine]
    EmailIntegrationConfig:
      type: object
      properties:
        host: { type: string }
        port: { type: integer }
        secure: { type: boolean }
        password: { type: string }
        sender_email: { type: string, format: email }
        sender_name: { type: string }
    GoogleAuthIntegrationConfig:
      type: object
      properties:
        client_id: { type: string }
    GoogleDriveIntegrationConfig:
      type: object
      properties:
        project_id: { type: string }
        folder_id: { type: string }
        schedule_mode: { type: string, enum: [manual, daily, weekly, monthly] }
        include_requirements_csv: { type: boolean }
        include_test_cases_csv: { type: boolean }
        next_sync_at: { type: string, format: date-time, nullable: true }
        last_synced_at: { type: string, format: date-time, nullable: true }
        last_sync_status: { type: string, nullable: true }
        last_sync_transaction_id: { type: string, nullable: true }
        last_sync_summary: { type: string, nullable: true }
    GithubIntegrationConfig:
      type: object
      properties:
        project_id: { type: string }
        owner: { type: string }
        repo: { type: string }
        branch: { type: string }
        directory: { type: string }
        file_extension: { type: string }
        schedule_mode: { type: string, enum: [manual, daily, weekly, monthly] }
        next_sync_at: { type: string, format: date-time, nullable: true }
        last_synced_at: { type: string, format: date-time, nullable: true }
        last_sync_status: { type: string, nullable: true }
        last_sync_transaction_id: { type: string, nullable: true }
        last_sync_summary: { type: string, nullable: true }
    TestEngineIntegrationConfig:
      type: object
      properties:
        project_id: { type: string, nullable: true }
        runner: { type: string, example: hybrid }
        dispatch_mode: { type: string, example: qaira-pull }
        execution_scope: { type: string, example: api+web }
        active_web_engine: { type: string, enum: [playwright, selenium] }
        browser: { type: string, enum: [chromium, firefox, webkit] }
        headless: { type: boolean }
        healing_enabled: { type: boolean }
        max_repair_attempts: { type: integer }
        trace_mode: { type: string, enum: [off, on, on-first-retry, retain-on-failure] }
        video_mode: { type: string, enum: [off, on, retain-on-failure] }
        capture_console: { type: boolean }
        capture_network: { type: boolean }
        artifact_retention_days: { type: integer }
        run_timeout_seconds: { type: integer }
        queue_poll_interval_minutes: { type: integer, example: 5 }
        promote_healed_patches: { type: string, example: review }
    Integration:
      type: object
      properties:
        id: { type: string }
        type:
          $ref: "#/components/schemas/IntegrationType"
        name: { type: string }
        base_url: { type: string, nullable: true }
        api_key: { type: string, nullable: true }
        model: { type: string, nullable: true }
        project_key: { type: string, nullable: true }
        username: { type: string, nullable: true }
        config:
          nullable: true
          oneOf:
