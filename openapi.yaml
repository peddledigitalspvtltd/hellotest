components:
  securitySchemes:
    traceConsoleSession:
      type: apiKey
      in: cookie
      name: hellotest_ops_traces
    alertConsoleSession:
      type: apiKey
      in: cookie
      name: hellotest_ops_alerts
    grafanaBrowserSession:
      type: apiKey
      in: cookie
      name: hellotest_grafana
      description: Encrypted HttpOnly browser capability issued to a signed-in administrator. Current user and project permissions are rechecked on every request.
    inspectionCapability:
      type: apiKey
      in: query
      name: token
      description: Encrypted, expiring capability limited to one inspection session or one paired installer. Original login and current permissions are revalidated for every request.
    inspectionCapabilityHeader:
      type: apiKey
      in: header
      name: X-HelloTest-Recorder-Token
      description: Header alternative to the encrypted inspection-session capability. Not a Test Engine shared secret.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Signed HelloTest browser-session token returned by the login or signup flow.
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Scoped HelloTest API key. API-key management endpoints require bearerAuth instead.
    testEngineSecret:
      type: apiKey
      in: header
      name: X-HelloTest-TestEngine-Secret
      description: Shared secret accepted by internal Test Engine job endpoints.
    testEngineCallbackSignature:
      type: apiKey
      in: header
      name: x-testengine-signature
      description: HMAC SHA-256 signature of the raw Test Engine callback payload.
  parameters:
    CatalogPageSizeQuery:
      name: page_size
      in: query
      description: Maximum records returned by a bounded catalog page. Continue with the same page size for smooth scrolling.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 25
    CatalogCursorQuery:
      name: cursor
      in: query
      description: Opaque next_cursor from the previous response. Omit for the first page and reset whenever filters or
        project/app scope change. Invalid or mismatched cursors return 400.
      schema:
        type: string
    CatalogIncludePageQuery:
      name: include_page
      in: query
      description: Set true to request the first paged envelope. Supplying cursor also requests a paged response.
      schema:
        type: boolean
        default: false
    CatalogIncludeTotalQuery:
      name: include_total
      in: query
      description: Set false when metrics are requested separately. Skips the full-scope count and omits total; next_cursor
        and is_last still describe continuation.
      schema:
        type: boolean
        default: true
    CatalogProjectionQuery:
      name: projection
      in: query
      description: Use summary for list rows. Story and Test Case summaries omit or shorten large authoring fields; fetch the
        item detail before editing.
      schema:
        type: string
        enum:
          - summary
          - detail
    CatalogIncludeExecutionQuery:
      name: include_execution
      in: query
      description: Include execution summaries and execution-derived filters/metrics. Requires run.view and result.view for
        the resolved project.
      schema:
        type: boolean
        default: false
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
    ProjectIdQuery:
      name: project_id
      in: query
      schema:
        type: string
    UserIdQuery:
      name: user_id
      in: query
      schema:
        type: string
    RoleIdQuery:
      name: role_id
      in: query
      schema:
        type: string
    AppTypeIdQuery:
      name: app_type_id
      in: query
      schema:
        type: string
    IntegrationTypeQuery:
      name: type
      in: query
      schema:
        $ref: "#/components/schemas/IntegrationType"
    IsActiveQuery:
      name: is_active
      in: query
      schema:
        type: boolean
    ParentIdQuery:
      name: parent_id
      in: query
      schema:
        type: string
        description: Use the literal string `null` to filter root suites.
    SuiteIdQuery:
      name: suite_id
      in: query
      schema:
        type: string
    RequirementIdQuery:
      name: requirement_id
      in: query
      schema:
        type: string
    TestCaseIdQuery:
      name: test_case_id
      in: query
      schema:
        type: string
    TestCaseIdPathParam:
      name: testCaseId
      in: path
      required: true
      schema:
        type: string
    RunIdPathParam:
      name: runId
      in: path
      required: true
      schema:
        type: string
    ExecutionIdQuery:
      name: execution_id
      in: query
      schema:
        type: string
    StepIdPathParam:
      name: stepId
      in: path
      required: true
      schema:
        type: string
    TestEngineSignatureHeader:
      name: x-testengine-signature
      in: header
      required: true
      schema:
        type: string
      description: HMAC SHA-256 signature of the raw callback payload.
    StatusQuery:
      name: status
      in: query
      schema:
        type: string
    PriorityQuery:
      name: priority
      in: query
      schema:
        type: integer
    ExecutionStatusQuery:
      name: status
      in: query
      schema:
        type: string
        enum: [queued, running, completed, failed, aborted]
  responses:
    ErrorResponse:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    InstanceSetupSnapshot:
      type: object
      required: [running, job]
      properties:
        running:
          type: boolean
          description: True while the durable job is queued or running.
        job:
          $ref: '#/components/schemas/InstanceSetupJob'
    InstanceSetupJob:
      type: object
      nullable: true
      required: [id, status, phase, requested_modules, installed_modules, dataset_version, manifest_hash, files, current_file, total_files, completed_files, attempts, error, result, created_at, started_at, finished_at, updated_at]
      properties:
        id: { type: string }
        status: { type: string, enum: [queued, running, completed, failed] }
        phase: { type: string, enum: [validating, installing, verifying] }
        requested_modules: { type: array, items: { type: string } }
        installed_modules:
          type: array
          description: Selected modules plus their required dependencies, in installation order.
          items: { type: string }
        dataset_version: { type: integer, minimum: 1 }
        manifest_hash: { type: string, pattern: '^[a-f0-9]{64}$' }
        files:
          type: array
          items:
            $ref: '#/components/schemas/InstanceSetupFile'
        current_file: { type: string, nullable: true }
        total_files: { type: integer, minimum: 0 }
        completed_files: { type: integer, minimum: 0 }
        attempts: { type: integer, minimum: 0 }
        error:
          type: object
          nullable: true
          required: [code, message, retryable]
          properties:
            code: { type: string }
            message: { type: string }
            file: { type: string }
            retryable: { type: boolean }
        result:
          $ref: '#/components/schemas/InstanceSetupResult'
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time }
    InstanceSetupFile:
      type: object
      required: [key, module, path, depends_on, record_count, sha256, status, attempts]
      properties:
        key: { type: string }
        module: { type: string }
        path: { type: string, description: Relative repository JSON file path. }
        table: { type: string }
        keys: { type: array, items: { type: string } }
        kind: { type: string, enum: [role_presets] }
        depends_on: { type: array, items: { type: string } }
        record_count: { type: integer, minimum: 1 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        status: { type: string, enum: [pending, running, retrying, completed, failed] }
        attempts: { type: integer, minimum: 0 }
        error: { type: string }
        fallback_batch_size: { type: integer, enum: [10, 1] }
        inserted_records: { type: integer, minimum: 0 }
        existing_records: { type: integer, minimum: 0 }
        total_records: { type: integer, minimum: 0 }
        administrator_memberships: { type: integer, minimum: 0 }
        roles:
          $ref: '#/components/schemas/InstanceSetupRoles'
    InstanceSetupRoles:
      type: object
      required: [created, retained]
      properties:
        created:
          type: array
          items:
            $ref: '#/components/schemas/InstanceSetupRoleIdentity'
        retained:
          type: array
          items:
            $ref: '#/components/schemas/InstanceSetupRoleIdentity'
    InstanceSetupRoleIdentity:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    InstanceSetupResult:
      type: object
      nullable: true
      description: Present only after all selected files have passed final verification and the installation audit has been saved.
      required: [requested, installed, dependencies_added, project_id, administrator_memberships, roles, idempotent, version, manifest_hash, inserted_records, existing_records, module_results, file_results]
      properties:
        requested: { type: array, items: { type: string } }
        installed: { type: array, items: { type: string } }
        dependencies_added: { type: array, items: { type: string } }
        project_id: { type: string, nullable: true }
        administrator_memberships: { type: integer, minimum: 0 }
        roles:
          $ref: '#/components/schemas/InstanceSetupRoles'
        idempotent: { type: boolean, enum: [true] }
        version: { type: integer, minimum: 1 }
        manifest_hash: { type: string, pattern: '^[a-f0-9]{64}$' }
        inserted_records: { type: integer, minimum: 0 }
        existing_records: { type: integer, minimum: 0 }
        module_results:
          type: array
          items:
            type: object
            required: [key, inserted_records, existing_records, total_records]
            properties:
              key: { type: string }
              inserted_records: { type: integer, minimum: 0 }
              existing_records: { type: integer, minimum: 0 }
              total_records: { type: integer, minimum: 0 }
        file_results:
          type: array
          items:
            $ref: '#/components/schemas/InstanceSetupFile'
    ProjectDeletionJob:
      type: object
      required: [id, project_id, project_name, status, phase, processed_rows, attempts]
      properties:
