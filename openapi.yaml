      summary: Read scoped Shared Step reuse and recorded execution metrics
      description: Exact current test case step counts and 90-day recorded execution outcomes in the selected application and its project. Requires shared_step.view and testcase.view. Reusability (returned in reusability_index for API compatibility) is shared-group reference occurrences across all test cases divided by all authored test case step rows times 100. Repeated uses of the same group within one case each count separately. The ratio is null when there are no steps and is independent of execution frequency and run permissions. Run and result permissions control execution evidence. MTTI is unavailable without recorded failure-to-isolation pairs.
      parameters:
        - { name: app_type_id, in: query, required: true, schema: { type: string } }
