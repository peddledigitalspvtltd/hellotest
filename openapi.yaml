          $ref: "#/components/schemas/TestEngineArtifactBundle"
        patch_proposals:
          type: array
          items:
            $ref: "#/components/schemas/TestEnginePatchProposal"
        emitted_at: { type: string, format: date-time, nullable: true }
    TestEngineCallbackAcceptedResponse:
      type: object
      properties:
        accepted: { type: boolean }
        execution_id: { type: string }
        execution_result_id: { type: string }
        transaction_id: { type: string }
      required: [accepted, execution_id, execution_result_id, transaction_id]
    TestEngineLeaseRequest:
      type: object
      properties:
        worker_id: { type: string }
        engine_host: { type: string }
        lease_seconds: { type: number }
    TestEngineLeaseResponse:
      type: object
      properties:
        job:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/TestEngineQueuedJob"
    TestEngineJobStartRequest:
      type: object
      properties:
        worker_id: { type: string }
    TestEngineJobStartedResponse:
      type: object
      properties:
        job_id: { type: string }
        execution_result_id: { type: string }
        status: { type: string, enum: [running] }
    TestEngineApiStepExecutionResponse:
      type: object
      properties:
        job_id: { type: string }
        step_id: { type: string }
        status: { type: string, enum: [passed, failed] }
        note: { type: string }
        detail:
          $ref: "#/components/schemas/ExecutionApiDetail"
        captures:
          $ref: "#/components/schemas/StringMap"
        case_status: { type: string, enum: [running, failed] }
        execution_result_id: { type: string }
    TestEngineStepReportRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [passed, failed, blocked] }
        note: { type: string }
        evidence:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/TestEngineInlineEvidence"
        api_detail:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ExecutionApiDetail"
        captures:
          $ref: "#/components/schemas/StringMap"
        recovery_attempted: { type: boolean }
        recovery_succeeded: { type: boolean }
    TestEngineStepReportResponse:
      type: object
      properties:
        job_id: { type: string }
        step_id: { type: string }
        status: { type: string, enum: [passed, failed, blocked] }
        case_status: { type: string, enum: [running, passed, failed, blocked] }
        execution_result_id: { type: string }
        captures:
          $ref: "#/components/schemas/StringMap"
    TestEngineJobCompletionRequest:
      type: object
      properties:
        status: { type: string, enum: [passed, failed, blocked] }
