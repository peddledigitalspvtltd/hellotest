                $ref: "#/components/schemas/IdResponse"
  /executions/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      tags: [Executions]
      summary: Get execution by ID
      responses:
        "200":
          description: Execution record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Execution"
    put:
      tags: [Executions]
      summary: Edit an unfinished run's setup, scope, assignment, or delivery context
      description: Finished runs are immutable. Runtime settings can change only before the first start and before results exist. Active automated membership is locked. Removing a case with execution history is rejected. Retained case content, parameters, steps, and results are preserved; suite grouping follows the edited scope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateExecutionRequest"
      responses:
        "200":
          description: Updated run revision
          content:
            application/json:
              schema:
                type: object
                required: [updated, revision]
                properties:
                  updated: { type: boolean }
                  revision: { type: integer, minimum: 1 }
        "409":
          description: RUN_FINISHED, RUN_CONTEXT_LOCKED, RUN_SCOPE_LOCKED, RUN_CASE_HAS_HISTORY, or REVISION_CONFLICT. Refresh the run before retrying a revision conflict.
    delete:
      tags: [Executions]
      summary: Delete execution
      responses:
        "200":
          description: Delete result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedResponse"
  /executions/{id}/cases/{testCaseId}/assignment:
    parameters:
      - $ref: "#/components/parameters/IdParam"
      - $ref: "#/components/parameters/TestCaseIdPathParam"
    put:
      tags: [Executions]
      summary: Update execution case assignment
      description: Assignments cannot change after the run has finished.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateExecutionAssignmentRequest"
      responses:
        "200":
          description: Update result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdatedResponse"
  /executions/{id}/{level}/{scopeId}/assignment:
