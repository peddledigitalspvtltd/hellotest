        summary: { type: string }
        deterministic_attempted: { type: boolean }
        healing_attempted: { type: boolean }
        healing_succeeded: { type: boolean }
        artifact_bundle:
          $ref: "#/components/schemas/TestEngineArtifactBundle"
        patch_proposals:
          type: array
          items:
            $ref: "#/components/schemas/TestEnginePatchProposal"
    TestEngineJobCompletionResponse:
      type: object
      properties:
        job_id: { type: string }
        execution_result_id: { type: string }
        status: { type: string, enum: [passed, failed, blocked] }
    TestEngineJobFailRequest:
      type: object
      properties:
        message: { type: string }
    AutomationGeneratorQueueRequest:
      type: object
      properties:
        integration_id: { type: string }
        start_url: { type: string }
        additional_context: { type: string }
        test_environment_id: { type: string }
        test_configuration_id: { type: string }
        test_data_set_id: { type: string }
        scheduled_at:
          type: string
          format: date-time
          description: Future ISO 8601 timestamp with a timezone. Omit to queue immediately; execution begins when a worker is available at or after this time.
    AutomationBatchQueueRequest:
      allOf:
        - $ref: "#/components/schemas/AutomationGeneratorQueueRequest"
        - type: object
          required: [app_type_id]
          properties:
            app_type_id: { type: string }
            test_case_ids:
              type: array
              items: { type: string }
              description: Cases in the selected application to build.
            failure_threshold: { type: number }
    AutomationBuildQueueResponse:
      type: object
      required: [transaction_id, job_id, queued, status, scheduled_at]
      properties:
        id:
          type: string
          description: Transaction identifier, included for batch builds.
        transaction_id: { type: string }
        job_id: { type: string }
        queued: { type: boolean, enum: [true] }
        status: { type: string, enum: [queued] }
        scheduled_at: { type: string, format: date-time, nullable: true }
    AutomationBuildTransaction:
      type: object
      required: [id, project_id, category, action, status, title, metadata]
      properties:
        id: { type: string }
        project_id: { type: string }
        app_type_id: { type: string, nullable: true }
        category: { type: string, enum: [automation_build] }
        action: { type: string }
        status: { type: string, enum: [queued, running, completed, failed] }
        title: { type: string }
        description: { type: string, nullable: true }
        related_kind: { type: string, nullable: true }
        related_id: { type: string, nullable: true }
        created_by: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
        event_count: { type: integer, minimum: 0 }
        latest_event_at: { type: string, format: date-time, nullable: true }
        created_user: { type: object, nullable: true, additionalProperties: true }
        metadata:
          type: object
          additionalProperties: true
          properties:
            progress_percent: { type: number, minimum: 0, maximum: 100 }
            current_phase: { type: string }
            scheduled_at: { type: string, format: date-time, nullable: true }
            test_case_id:
              type: string
              description: For a completed generator build, the resulting automated case identifier.
            source_test_case_id: { type: string, nullable: true }
            output_test_case_ids:
              type: array
              items: { type: string }
              description: Automated case identifiers produced by a batch build.
            generated_steps: { type: integer, minimum: 0 }
            failed: { type: integer, minimum: 0 }
