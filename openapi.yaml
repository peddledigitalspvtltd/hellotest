  /requirement-releases/readiness:
    get:
      tags: [Releases]
      summary: List readiness metrics for every project Release
      description: Requires requirement_iteration.view, requirement.view, testcase.view, run.view, result.view and feedback.view in the selected project, including enabled source features. Returns 403 when any source is unavailable. Execution evidence is limited to linked cases and runs whose release exactly matches the stored Release fix version after trimming and case normalization.
      parameters:
        - $ref: "#/components/parameters/ProjectIdQuery"
      responses:
        "200":
          description: Release readiness summaries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RequirementReleaseReadiness" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /requirement-releases/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      tags: [Releases]
      summary: Read a Release with effective Sprint-derived and direct Story scope
      responses:
        "200":
          description: Hydrated Release
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequirementRelease" }
    put:
      tags: [Releases]
      summary: Update Release metadata or replace its Sprint and Story scope
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRequirementReleaseRequest" }
      responses:
        "200":
          description: Updated Release
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateRequirementReleaseResponse" }
    delete:
      tags: [Releases]
      summary: Delete a Release without deleting its Stories or Sprints
      responses:
        "200":
          description: Release deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletedResponse" }
  /requirement-releases/{id}/scope:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    post:
      tags: [Releases]
      summary: Append native Stories and Sprints to an existing Release without replacing current scope
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppendRequirementReleaseScopeRequest" }
      responses:
        "200":
          description: Exact appended identifiers and the resulting hydrated Release
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppendRequirementReleaseScopeResponse" }
        "409": { description: Completed Releases are read-only }
  /requirement-releases/{id}/readiness:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      tags: [Releases]
      summary: Calculate readiness metrics for one Release
      description: Requires delivery, Story, Test Case, Run, Result and Defect read grants in the persisted Release project. Caller-supplied scope does not override ownership. Runs must have that project's exact normalized stored Release fix version. No matching results produces a null pass rate; results from other releases are not substituted.
      responses:
        "200":
          description: Release readiness evidence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequirementReleaseReadiness" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /requirement-releases/{id}/release-notes:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    post:
      tags: [Releases]
      summary: Generate evidence-bounded release notes for human review
      description: Requires requirement_iteration.view, requirement.view, testcase.view, run.view, result.view and feedback.view in the persisted Release project before gathering evidence or calling an AI provider. Execution validation uses the same stored Release fix-version cohort as readiness.
      responses:
        "200": { description: "Release notes, generation provenance, scope summary, and readiness evidence" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
