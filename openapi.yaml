  /execution-results/release-readiness:
    get:
      tags: [Execution Results]
      summary: Return bounded project release-readiness evidence from current persisted results
      description: >-
        Requires run.view and result.view. Release and sprint filters match their
        respective fields exactly after trimming and case normalization; build never
        widens release scope. Results retain only the latest attempt per run/case/data
        row, with lifecycle-derived updated_at. Execution case_snapshots include
        test_case_id and expected_iterations, without frozen data values. complete and
        reasons disclose run/result truncation. candidate_runs and candidate_results
        are bounded limit-plus-one lookahead counts, not full inventory totals.
      parameters:
        - $ref: "#/components/parameters/ProjectIdQuery"
        - { name: release, in: query, schema: { type: string } }
        - { name: sprint, in: query, schema: { type: string } }
        - { name: run_limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: result_limit, in: query, schema: { type: integer, minimum: 1, maximum: 5000, default: 2000 } }
      responses:
        "200": { description: "Metrics with completeness, methodology, and human-decision disclosure" }
