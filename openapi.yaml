  /knowledge/ingestions:
    post:
      tags: [Knowledge]
      summary: Build versioned, redacted, chunked project context from records, text, chat, URLs, or one governed file
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          description: Stable 8-255 character key for safely retrying JSON or multipart ingestion requests.
          schema: { type: string, minLength: 8, maxLength: 255, pattern: "^[A-Za-z0-9._:-]+$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateKnowledgeIngestionRequest" }
          multipart/form-data:
            schema:
              type: object
              required: [project_id, file]
              properties:
                project_id: { type: string }
                collection_id: { type: string }
                app_type_id: { type: string }
                title: { type: string }
                extracted_text: { type: string, description: Required for binary media unless a governed extractor is configured. }
                caption: { type: string }
                transcript: { type: string }
                chunking: { type: string, description: JSON-encoded KnowledgeChunkingConfig. }
                file: { type: string, format: binary }
      responses:
        "202":
          description: Durable JSON or multipart ingestion job accepted; poll the Location endpoint until terminal.
          headers:
            Location:
              schema: { type: string }
            Retry-After:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeIngestionResponse" }
        "415":
          description: "MIME, extension, or file signature is unsupported or inconsistent"
  /knowledge/ingestions/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      tags: [Knowledge]
      summary: Read one project-scoped knowledge ingestion job
      responses:
        "200":
          description: Ingestion job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeIngestionJob" }
