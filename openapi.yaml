      description: Requires feedback.view in the Defect project. Returns newest events first, including the known creation event for older Defects whose earlier edits were not recorded.
      responses:
        "200":
          description: Defect history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IssueHistoryEntry" }
