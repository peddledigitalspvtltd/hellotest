openapi: 3.0.3
info:
  title: QAIra API
  version: 1.1.0
  description: |
    OpenAPI specification for the current QAIra Fastify + PostgreSQL backend.
    This spec documents the implemented CRUD resources, request payloads,
    query filters, and the execution lifecycle actions.
servers:
  - url: http://localhost:3000
    description: Local development server
tags:
  - name: Auth
  - name: Users
  - name: Roles
  - name: Projects
  - name: Project Members
  - name: App Types
  - name: Integrations
  - name: Requirements
  - name: Test Suites
  - name: Test Cases
  - name: Test Steps
  - name: Executions
  - name: Execution Schedules
  - name: Execution Results
  - name: Evidence
  - name: Quality Analytics
  - name: Test Engine
paths:
  /auth/signup:
    post:
      tags: [Auth]
      summary: Create account and start a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "200":
          description: Session payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /auth/login:
    post:
      tags: [Auth]
      summary: Login and return a signed session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /auth/session:
    get:
      tags: [Auth]
      summary: Resolve the current session from a Bearer token
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          description: Bearer token returned by the auth endpoints.
      responses:
        "200":
          description: Session payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"

  /users:
    get:
      tags: [Users]
      summary: List users
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      tags: [Users]
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "200":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /users/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      tags: [Users]
      summary: Get user by ID
      responses:
        "200":
          description: User record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "500":
          $ref: "#/components/responses/ErrorResponse"
    put:
      tags: [Users]
      summary: Update user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Update result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdatedResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
    delete:
      tags: [Users]
      summary: Delete user
      responses:
        "200":
          description: Delete result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"

  /roles:
    get:
      tags: [Roles]
      summary: List roles
      responses:
        "200":
          description: List of roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
    post:
      tags: [Roles]
      summary: Create role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleRequest"
      responses:
        "200":
          description: Role created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /roles/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      tags: [Roles]
      summary: Get role by ID
      responses:
        "200":
          description: Role record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
    put:
      tags: [Roles]
      summary: Update role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleRequest"
      responses:
        "200":
          description: Update result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdatedResponse"
    delete:
      tags: [Roles]
      summary: Delete role
      responses:
        "200":
          description: Delete result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedResponse"

  /projects:
    get:
      tags: [Projects]
      summary: List projects
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      tags: [Projects]
      summary: Create project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "200":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResponse"
  /projects/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      tags: [Projects]
      summary: Get project by ID
      responses:
        "200":
          description: Project record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    put:
      tags: [Projects]
      summary: Update project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Update result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdatedResponse"
    delete:
      tags: [Projects]
      summary: Delete project
      responses:
        "200":
          description: Delete result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedResponse"

  /project-members:
    get:
      tags: [Project Members]
      summary: List project members
      parameters:
        - $ref: "#/components/parameters/ProjectIdQuery"
        - $ref: "#/components/parameters/UserIdQuery"
        - $ref: "#/components/parameters/RoleIdQuery"
      responses:
        "200":
          description: List of project memberships
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectMember"
    post:
      tags: [Project Members]
      summary: Create project member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectMemberRequest"
      responses:
        "200":
          description: Membership created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResponse"
  /project-members/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      tags: [Project Members]
      summary: Get project member by ID
      responses:
        "200":
          description: Project member record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"
    put:
      tags: [Project Members]
      summary: Update project member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectMemberRequest"
      responses:
        "200":
          description: Update result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdatedResponse"
    delete:
      tags: [Project Members]
      summary: Delete project member
      responses:
        "200":
          description: Delete result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedResponse"

  /app-types:
    get:
      tags: [App Types]
      summary: List app types
      parameters:
        - $ref: "#/components/parameters/ProjectIdQuery"
      responses:
        "200":
          description: List of app types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppType"
    post:
      tags: [App Types]
      summary: Create app type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAppTypeRequest"
      responses:
        "200":
          description: App type created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResponse"
  /app-types/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      tags: [App Types]
      summary: Get app type by ID
      responses:
        "200":
          description: App type record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppType"
    put:
      tags: [App Types]
      summary: Update app type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAppTypeRequest"
      responses:
        "200":
          description: Update result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdatedResponse"
    delete:
      tags: [App Types]
      summary: Delete app type
      responses:
        "200":
          description: Delete result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedResponse"

  /requirements:
    get:
      tags: [Requirements]
      summary: List requirements
      parameters:
        - $ref: "#/components/parameters/ProjectIdQuery"
        - $ref: "#/components/parameters/StatusQuery"
        - $ref: "#/components/parameters/PriorityQuery"
      responses:
        "200":
          description: List of requirements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Requirement"
    post:
      tags: [Requirements]
      summary: Create requirement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRequirementRequest"
      responses:
        "200":
          description: Requirement created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResponse"
  /requirements/import:
    post:
      tags: [Requirements]
      summary: Bulk import requirements from parsed CSV rows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkImportRequirementsRequest"
      responses:
        "200":
          description: Import result with per-row outcomes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkImportRequirementsResponse"
  /requirements/ai-create-preview:
    post:
      tags: [Requirements]
      summary: Generate bounded requirement drafts for explicit human review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id]
              properties:
                project_id: { type: string }
                integration_id: { type: string }
                additional_context: { type: string, maxLength: 20000 }
                external_links:
                  type: array
                  maxItems: 20
                  items: { type: string }
                images:
                  type: array
                  maxItems: 4
                  items:
                    type: object
                    required: [url]
                    properties:
                      name: { type: string }
                      url: { type: string }
                max_requirements: { type: integer, minimum: 1, maximum: 6 }
                priority: { type: integer, minimum: 1, maximum: 5 }
                status: { type: string }
      responses:
        "200":
          description: Review-only requirement candidates with provenance and fallback disclosure
  /requirements/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      tags: [Requirements]
      summary: Get requirement by ID
      responses:
        "200":
          description: Requirement record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Requirement"
    put:
      tags: [Requirements]
      summary: Update requirement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRequirementRequest"
      responses:
        "200":
          description: Update result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdatedResponse"
    delete:
      tags: [Requirements]
      summary: Delete requirement
      responses:
        "200":
          description: Delete result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedResponse"

  /requirement-defects:
    get:
      tags: [Requirements]
      summary: List requirement defect mappings
      parameters:
        - $ref: "#/components/parameters/RequirementIdQuery"
        - name: issue_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Requirement defect mappings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RequirementDefectMapping"
  /requirement-defects/replace:
    put:
      tags: [Requirements]
      summary: Replace linked defects for a requirement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceRequirementDefectsRequest"
      responses:
        "200":
          description: Replace result
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: boolean }
                  mapped: { type: integer }

  /test-suites:
    get:
      tags: [Test Suites]
      summary: List test suites
      parameters:
        - $ref: "#/components/parameters/AppTypeIdQuery"
        - $ref: "#/components/parameters/ParentIdQuery"
      responses:
        "200":
          description: List of test suites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TestSuite"
    post:
      tags: [Test Suites]
      summary: Create test suite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTestSuiteRequest"
      responses:
        "200":
          description: Test suite created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResponse"
  /test-suites/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      tags: [Test Suites]
      summary: Get test suite by ID
      responses:
        "200":
          description: Test suite record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestSuite"
    put:
      tags: [Test Suites]
      summary: Update test suite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTestSuiteRequest"
      responses:
        "200":
          description: Update result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdatedResponse"
    delete:
      tags: [Test Suites]
      summary: Delete test suite
      responses:
        "200":
          description: Delete result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedResponse"

  /test-cases:
    get:
      tags: [Test Cases]
      summary: List test cases
      parameters:
        - $ref: "#/components/parameters/SuiteIdQuery"
        - $ref: "#/components/parameters/RequirementIdQuery"
        - $ref: "#/components/parameters/AppTypeIdQuery"
        - $ref: "#/components/parameters/StatusQuery"
        - name: module_id
          in: query
          schema: { type: string }
        - name: unassigned_module
          in: query
          schema: { type: boolean }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 200 }
        - name: cursor
          in: query
          schema: { type: string }
        - name: include_page
          in: query
          description: Return the paged envelope used by hierarchy and infinite-list screens.
          schema: { type: boolean }
        - name: projection
          in: query
          schema: { type: string, enum: [summary, detail] }
      responses:
        "200":
          description: List of test cases
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/TestCase"
                  - type: object
                    required: [items, total, next_cursor, is_last]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/TestCase"
                      total: { type: integer, minimum: 0 }
                      next_cursor: { type: string, nullable: true }
                      is_last: { type: boolean }
    post:
      tags: [Test Cases]
      summary: Create test case
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTestCaseRequest"
      responses:
        "200":
          description: Test case created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResponse"
  /test-cases/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      tags: [Test Cases]
      summary: Get test case by ID
      responses:
        "200":
          description: Test case record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestCase"
    put:
      tags: [Test Cases]
      summary: Update test case
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTestCaseRequest"
      responses:
        "200":
          description: Update result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdatedResponse"
    delete:
      tags: [Test Cases]
      summary: Delete test case
      responses:
        "200":
          description: Delete result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedResponse"

  /test-steps:
    get:
      tags: [Test Steps]
      summary: List test steps
      parameters:
        - $ref: "#/components/parameters/TestCaseIdQuery"
      responses:
        "200":
          description: List of test steps
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TestStep"
    post:
      tags: [Test Steps]
      summary: Create test step
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTestStepRequest"
      responses:
        "200":
          description: Test step created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResponse"
  /test-steps/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      tags: [Test Steps]
      summary: Get test step by ID
      responses:
        "200":
          description: Test step record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestStep"
    put:
      tags: [Test Steps]
      summary: Update test step
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTestStepRequest"
      responses:
        "200":
          description: Update result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdatedResponse"
    delete:
      tags: [Test Steps]
      summary: Delete test step
      responses:
        "200":
          description: Delete result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedResponse"

  /test-steps/move-automation:
    post:
      tags: [Test Steps]
      summary: Move or swap an automation block between manual test steps
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_step_id, target_step_id]
              properties:
                source_step_id:
                  type: string
                target_step_id:
                  type: string
      responses:
        "200":
          description: Automation block moved transactionally
          content:
            application/json:
              schema:
                type: object
                properties:
                  moved:
                    type: boolean
                  source_step_id:
                    type: string
                  target_step_id:
                    type: string

  /integrations:
    get:
      tags: [Integrations]
      summary: List integrations
      parameters:
        - $ref: "#/components/parameters/IntegrationTypeQuery"
        - $ref: "#/components/parameters/IsActiveQuery"
      responses:
        "200":
          description: List of integrations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Integration"
    post:
      tags: [Integrations]
      summary: Create integration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIntegrationRequest"
      responses:
        "200":
          description: Integration created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResponse"
  /integrations/test-connection:
    post:
      tags: [Integrations]
      summary: Test a Test Engine integration connection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestIntegrationConnectionRequest"
      responses:
        "200":
          description: Connection capability summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestEngineConnectionResponse"
  /integrations/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      tags: [Integrations]
      summary: Get integration by ID
      responses:
        "200":
          description: Integration record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Integration"
    put:
      tags: [Integrations]
      summary: Update integration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIntegrationRequest"
      responses:
        "200":
          description: Updated integration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Integration"
    delete:
      tags: [Integrations]
      summary: Delete integration
      responses:
        "200":
          description: Delete result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedResponse"

  /executions/smart-plan-preview:
    post:
      tags: [Executions]
      summary: Preview an AI-assisted smart execution plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmartExecutionPreviewRequest"
      responses:
        "200":
          description: Smart execution recommendation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmartExecutionPreviewResponse"
  /executions:
    get:
      tags: [Executions]
      summary: List executions
      parameters:
        - $ref: "#/components/parameters/ProjectIdQuery"
        - $ref: "#/components/parameters/AppTypeIdQuery"
        - $ref: "#/components/parameters/ExecutionStatusQuery"
      responses:
        "200":
          description: List of executions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Execution"
    post:
      tags: [Executions]
      summary: Create execution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExecutionRequest"
      responses:
        "200":
          description: Execution created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResponse"
  /executions/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      tags: [Executions]
      summary: Get execution by ID
      responses:
        "200":
          description: Execution record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Execution"
    put:
      tags: [Executions]
      summary: Update execution assignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
