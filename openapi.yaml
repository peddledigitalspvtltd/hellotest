      summary: Publish values for a configurable dropdown
      description: |
        Requires administrator access and the current global catalog revision.
        Existing codes cannot be deleted or changed; deactivate options to preserve history.
        Labels, descriptions, order, active state and supported defaults are configurable.
        The update and audit entry commit atomically. An unchanged submission creates no new revision or audit event.
      parameters:
