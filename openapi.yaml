      summary: Read a saved dashboard
      responses:
        "200": { description: Saved dashboard }
    put:
      tags: [Quality Analytics]
      summary: Update a saved dashboard
      responses:
        "200": { description: Updated dashboard }
    delete:
      tags: [Quality Analytics]
      summary: Delete a saved dashboard
      responses:
        "200": { description: Dashboard deleted }
  /analytics/query:
    post:
      tags: [Quality Analytics]
      summary: Evaluate one bounded project-scoped dashboard gadget
      description: >-
        Evaluates native HelloTest project evidence, optionally scoped by release.
        Metrics and chart series use the full scoped record set. Only table gadgets
        include rows (at most 100); returned is the table row count or the number of
        inspected records for other visualizations. Percent metrics use a 0–100 scale.
        Jira sources and nonempty JQL return DASHBOARD_QUERY_UNSUPPORTED because no
        authorized dashboard-to-Jira project mapping is configured by this API.
      responses:
        "200": { description: Gadget result }
        "400": { description: Unsupported source, query, or metric }
  /analytics/query-batch:
    post:
      tags: [Quality Analytics]
      summary: Evaluate up to 12 project-scoped dashboard gadgets
      description: >-
        Uses request-local evidence snapshots shared by project and normalized release,
        with at most two concurrent widget evaluations. Results retain input order;
        a failed scope or unsupported source returns an individual widget error while
        other widget results remain available. No evidence is cached across requests.
      responses:
        "200": { description: Per-gadget results and structured errors }
  /analytics/overview:
    get:
      tags: [Quality Analytics]
      summary: Evaluate complete permitted project inventory and a bounded execution window
      description: >-
        Requires dashboard.view and project access. Each source is separately checked
        against its project grant, API-key scope and feature policy before reading it.
        Unavailable counts are null and unavailable lists empty. A permitted-source
        failure rejects the request; zero is reserved for actual empty evidence.
        Inventory aggregates cover the full current project. Run outcomes select the
        newest attempt per run, test case and data row; frozen unexecuted rows remain
        pending. The trend groups current run outcomes by UTC end/start/creation day,
        not historical daily status. Only ten recent runs and eight attention items
        are returned. No predictive confidence or release approval score is calculated.
      parameters:
        - $ref: "#/components/parameters/ProjectIdQuery"
        - name: days
          in: query
          schema: { type: integer, enum: [14, 30, 90], default: 30 }
          description: UTC calendar days including today; the upper bound is evaluation time.
      responses:
        "200":
          description: Full inventory aggregates and current outcomes for the selected run cohort
          headers:
            Cache-Control: { schema: { type: string }, description: "private, no-store" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QualityAnalyticsOverview" }
        "400": { description: Invalid project scope or INVALID_ANALYTICS_WINDOW }
        "403": { description: Project or dashboard permission denied, or dashboard feature disabled }
  /analytics/dashboard-design-preview:
    post:
      tags: [Quality Analytics]
      summary: Produce a review-only stakeholder dashboard design
      description: >-
        Returns an unsaved template or model draft with explicit design_method and
        design_basis provenance. Legacy numeric confidence fields are retained for
        compatibility only; they are not calibrated accuracy scores and must not
        be displayed as measured confidence. Review metric choices before saving.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, stakeholder]
              properties:
                project_id: { type: string }
                stakeholder: { type: string, enum: [executive, product, quality, qa, automation] }
                release: { type: string, maxLength: 120 }
                prompt: { type: string, maxLength: 2000 }
                additional_context: { type: string, maxLength: 12000, description: Human-reviewed untrusted Smart Context used to shape the dashboard proposal. }
      responses:
        "200": { description: Unsaved dashboard preview with provenance }
