  /test-case-modules/{id}/test-cases:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      tags:
        - Test Case Modules
      summary: List module Test Cases using bounded cursor pagination
      description: Fetch children only when a module is expanded. Returns 25 records by default in module membership order.
        Module access requires testcase.view; execution summaries additionally require run.view and result.view. Large
        authoring fields are omitted with projection=summary.
      parameters:
        - $ref: "#/components/parameters/StatusQuery"
        - $ref: "#/components/parameters/PriorityQuery"
        - name: search
          in: query
          description: Literal case-insensitive search across the full scoped catalog, including module, Story, Suite and reviewer
            metadata.
          schema:
            type: string
        - name: workflow_status
          in: query
          description: Derived library status. Execution-derived states require include_execution=true.
          schema:
            type: string
            enum:
              - ai-generated
              - draft
              - pending-review
              - active
              - ready
              - automated
              - retired
              - passed
              - failed
        - name: step_filter
          in: query
          schema:
            type: string
            enum:
              - with-steps
              - no-steps
        - name: run_filter
          in: query
          description: Applied only with include_execution=true.
          schema:
            type: string
            enum:
              - with-runs
              - no-runs
        - name: exclude_automated
          in: query
          description: Omit independent automated cases from the manual library.
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/CatalogIncludeExecutionQuery"
        - $ref: "#/components/parameters/CatalogPageSizeQuery"
        - $ref: "#/components/parameters/CatalogCursorQuery"
        - $ref: "#/components/parameters/CatalogIncludeTotalQuery"
        - $ref: "#/components/parameters/CatalogProjectionQuery"
      responses:
        "200":
          description: A bounded module child page; total is omitted when include_total=false.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestCasePage"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
    post:
      tags: [Test Case Modules]
      summary: Append Test Cases to a module
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignTestCaseModuleCasesRequest" }
      responses:
        "200":
          description: Assignment result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestCaseModuleAssignmentResponse" }
    put:
      tags: [Test Case Modules]
      summary: Append or replace Test Case assignment for a module
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignTestCaseModuleCasesRequest" }
      responses:
