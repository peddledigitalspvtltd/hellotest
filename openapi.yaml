        "200": { description: Deleted Bug IDs and count }
  /test-steps/bulk:
    post:
      tags: [Test Steps]
      summary: Insert up to 100 ordered test steps atomically
      responses:
        "200": { description: Created steps and resulting order }
  /test-steps/bulk-delete:
    post:
      tags: [Test Steps]
      summary: Delete up to 200 scoped test steps atomically and normalize order
      responses:
        "200": { description: Deleted step IDs and resulting order }
  /test-suites/{id}/assign-test-cases:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    put:
      tags: [Test Suites]
      summary: Replace or append Test Cases with optimistic revision protection
      responses:
        "200": { description: Assignment count and next suite revision }
    post:
      tags: [Test Suites]
      summary: Compatibility endpoint for governed Test Case assignment
      responses:
        "200": { description: Assignment count and next suite revision }
  /test-case-modules/{id}/test-cases:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      tags: [Test Cases]
      summary: List module Test Cases using cursor pagination
      responses:
        "200": { description: Paginated Test Case records }
    put:
      tags: [Test Cases]
      summary: Replace Test Case assignment for a module
      responses:
        "200": { description: Assignment result }
  /test-data-sets/ai-generate-preview:
    post:
      tags: [Test Data]
      summary: Generate bounded fictional synthetic rows for human review
      responses:
        "200": { description: Synthetic columns and rows with safety and provenance disclosure }
  /executions/history:
    get:
      tags: [Executions]
      summary: Read project-scoped run history and traceability using cursor pagination
      parameters:
        - $ref: "#/components/parameters/ProjectIdQuery"
      responses:
        "200": { description: Paginated execution history records }
  /executions/{id}/cases/{testCaseId}/report.pdf:
    parameters:
      - $ref: "#/components/parameters/IdParam"
      - name: testCaseId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Executions]
      summary: Download a single-case execution evidence report
      responses:
        "200":
          description: PDF report
          content:
            application/pdf:
              schema: { type: string, format: binary }
  /executions/{id}/cases/{testCaseId}/share-report:
    parameters:
      - $ref: "#/components/parameters/IdParam"
      - name: testCaseId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Executions]
      summary: Email a single-case execution report and create an audit record
      responses:
        "200": { description: Delivery and audit transaction result }
  /execution-results/release-readiness:
    get:
      tags: [Execution Results]
      summary: Calculate project release-readiness evidence from current persisted results
      parameters:
        - $ref: "#/components/parameters/ProjectIdQuery"
      responses:
        "200": { description: Metrics with completeness, methodology, and human-decision disclosure }
  /execution-results/{id}/defect-links:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    put:
      tags: [Execution Results]
      summary: Link project-scoped Bugs to result steps with optimistic revision protection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecutionResultDefectLinksRequest"
      responses:
        "200":
          description: Updated result revision and normalized defect links
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionResultDefectLinksResponse"
        "409": { description: Result revision is stale or a Bug/step is outside the run scope }
  /quality-dashboards/{id}/report.pdf:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      tags: [Quality Analytics]
      summary: Download a current dashboard report PDF
      responses:
        "200":
          description: PDF report
          content:
            application/pdf:
              schema: { type: string, format: binary }
    post:
      tags: [Quality Analytics]
      summary: Generate and download a dashboard report PDF from the rendered dashboard view
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rendered_snapshot_data_url]
              properties:
                rendered_snapshot_data_url:
                  type: string
                  description: JPEG data URL captured from the complete rendered dashboard surface
                rendered_snapshot_name: { type: string }
                rendered_snapshot_captured_at: { type: string, format: date-time }
      responses:
        "200":
          description: PDF report
          content:
            application/pdf:
              schema: { type: string, format: binary }
  /quality-dashboards/{id}/share-report:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    post:
      tags: [Quality Analytics]
      summary: Email a live dashboard report and create an audit transaction
      responses:
        "200": { description: Delivery result and transaction ID }
components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
    ProjectIdQuery:
      name: project_id
      in: query
      schema:
        type: string
    UserIdQuery:
      name: user_id
      in: query
      schema:
        type: string
    RoleIdQuery:
      name: role_id
      in: query
      schema:
        type: string
    AppTypeIdQuery:
      name: app_type_id
      in: query
      schema:
        type: string
    IntegrationTypeQuery:
      name: type
      in: query
      schema:
        $ref: "#/components/schemas/IntegrationType"
    IsActiveQuery:
      name: is_active
      in: query
      schema:
        type: boolean
    ParentIdQuery:
      name: parent_id
      in: query
      schema:
        type: string
        description: Use the literal string `null` to filter root suites.
    SuiteIdQuery:
      name: suite_id
      in: query
      schema:
        type: string
    RequirementIdQuery:
      name: requirement_id
      in: query
      schema:
        type: string
    TestCaseIdQuery:
      name: test_case_id
      in: query
      schema:
        type: string
    TestCaseIdPathParam:
      name: testCaseId
      in: path
      required: true
      schema:
        type: string
    ExecutionIdQuery:
      name: execution_id
      in: query
      schema:
        type: string
    StepIdPathParam:
      name: stepId
      in: path
      required: true
      schema:
        type: string
    TestEngineSignatureHeader:
      name: x-testengine-signature
      in: header
      required: true
      schema:
        type: string
      description: HMAC SHA-256 signature of the raw callback payload.
    StatusQuery:
      name: status
      in: query
      schema:
        type: string
    PriorityQuery:
      name: priority
      in: query
      schema:
        type: integer
    ExecutionStatusQuery:
      name: status
      in: query
      schema:
        type: string
        enum: [queued, running, completed, failed, aborted]
  responses:
    ErrorResponse:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    IdResponse:
      type: object
      properties:
        id:
          type: string
      required: [id]
    UpdatedResponse:
      type: object
      properties:
        updated:
          type: boolean
          example: true
      required: [updated]
    RevisionCreatedResponse:
      type: object
      properties:
        id: { type: string }
        revision: { type: integer, minimum: 1 }
      required: [id, revision]
    RevisionUpdatedResponse:
      type: object
      properties:
        updated:
          type: boolean
          example: true
        revision: { type: integer, minimum: 1 }
      required: [updated, revision]
    DeletedResponse:
      type: object
      properties:
        deleted:
          type: boolean
          example: true
      required: [deleted]
    ErrorResponse:
      type: object
      properties:
        statusCode:
          type: integer
        error:
          type: string
        message:
          type: string
      required: [statusCode, error, message]
    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string, nullable: true }
        avatar_data_url: { type: string, nullable: true }
        auth_provider: { type: string, enum: [local, google] }
        email_verified: { type: boolean }
        role: { type: string, enum: [admin, member] }
        role_id: { type: string, nullable: true }
        role_name: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    SessionResponse:
      type: object
      properties:
        token: { type: string }
        user:
          $ref: "#/components/schemas/User"
      required: [token, user]
    SignupRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 6, maxLength: 128 }
        name: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 6, maxLength: 128 }
    CreateUserRequest:
      type: object
      required: [email, password, role_id]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 6, maxLength: 128 }
        name: { type: string }
        role_id: { type: string }
    UpdateUserRequest:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 6, maxLength: 128 }
        name: { type: string }
        role_id: { type: string }
        avatar_data_url: { type: string, nullable: true }
    RequirementIteration:
      type: object
      required: [id, project_id, name, state]
      properties:
        id: { type: string }
        display_id: { type: string, nullable: true }
        project_id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        goal: { type: string, nullable: true }
        labels:
          type: array
          items: { type: string }
        external_references:
          type: array
          items: { type: string }
        state: { type: string, enum: [future, active, closed] }
        start_date: { type: string, format: date-time, nullable: true }
        end_date: { type: string, format: date-time, nullable: true }
        requirement_count: { type: integer, minimum: 0 }
        requirement_ids:
          type: array
          items: { type: string }
    CreateRequirementIterationRequest:
      type: object
      required: [project_id, name]
      properties:
        project_id: { type: string }
        name: { type: string, minLength: 2 }
        description: { type: string }
        goal: { type: string }
        labels:
          type: array
          items: { type: string }
        external_references:
          type: array
          items: { type: string }
        state: { type: string, enum: [future, active] }
        start_date: { type: string, format: date-time }
        end_date: { type: string, format: date-time }
        requirement_ids:
          type: array
          default: []
          items: { type: string }
    UpdateRequirementIterationRequest:
      type: object
      properties:
        name: { type: string, minLength: 2 }
        description: { type: string }
        goal: { type: string }
        labels:
          type: array
          items: { type: string }
        external_references:
          type: array
          items: { type: string }
        state: { type: string, enum: [future, active, closed] }
        start_date: { type: string, format: date-time }
        end_date: { type: string, format: date-time }
        requirement_ids:
          type: array
          items: { type: string }
    CreateRequirementIterationResponse:
      type: object
      required: [id, sprint]
      properties:
        id: { type: string }
        sprint: { $ref: "#/components/schemas/RequirementIteration" }
        assignment:
          type: object
          nullable: true
          properties:
            assigned: { type: integer, minimum: 0 }
            assigned_issue_ids:
              type: array
              items: { type: string }
            assigned_issue_keys:
              type: array
              items: { type: string }
    Role:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
    CreateRoleRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
    UpdateRoleRequest:
      type: object
      properties:
        name: { type: string }
    Project:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        created_by: { type: string, nullable: true }
        created_at: { type: string }
    CreateProjectRequest:
      type: object
      required: [name, created_by]
      properties:
        name: { type: string }
        description: { type: string }
        created_by: { type: string }
    UpdateProjectRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
    ProjectMember:
      type: object
      properties:
        id: { type: string }
        project_id: { type: string }
        user_id: { type: string }
        role_id: { type: string }
        created_at: { type: string }
    CreateProjectMemberRequest:
      type: object
      required: [project_id, user_id, role_id]
      properties:
        project_id: { type: string }
        user_id: { type: string }
        role_id: { type: string }
    UpdateProjectMemberRequest:
      type: object
      properties:
        project_id: { type: string }
        user_id: { type: string }
        role_id: { type: string }
    AppType:
      type: object
      properties:
        id: { type: string }
        project_id: { type: string }
        name: { type: string }
        type:
          type: string
          enum: [web, api, android, ios, unified]
        is_unified: { type: integer }
        created_at: { type: string }
    CreateAppTypeRequest:
      type: object
      required: [project_id, name, type]
      properties:
        project_id: { type: string }
        name: { type: string }
        type:
          type: string
          enum: [web, api, android, ios, unified]
        is_unified: { type: boolean }
    UpdateAppTypeRequest:
      type: object
      properties:
        name: { type: string }
        is_unified: { type: boolean }
    Requirement:
      type: object
      properties:
        id: { type: string }
        display_id: { type: string, nullable: true }
        project_id: { type: string }
        title: { type: string }
        description: { type: string, nullable: true }
        external_references:
          type: array
          items: { type: string }
        labels:
          type: array
          items: { type: string }
        sprint: { type: string, nullable: true }
        fix_version: { type: string, nullable: true }
        release: { type: string, nullable: true }
        priority: { type: integer, nullable: true }
        status: { type: string, nullable: true }
        test_case_ids:
          type: array
          items: { type: string }
        defect_ids:
          type: array
          items: { type: string }
        defects:
          type: array
          items:
            $ref: "#/components/schemas/RequirementDefectLink"
        created_at: { type: string }
        updated_at: { type: string, nullable: true }
    RequirementDefectLink:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        status: { type: string, nullable: true }
        link_source:
          type: string
