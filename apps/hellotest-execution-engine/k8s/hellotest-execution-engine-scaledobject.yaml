apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: hellotest-execution-engine-scaledjob
  labels:
    app: hellotest-execution-engine
spec:
  pollingInterval: 30
  cooldownPeriod: 30
  minReplicaCount: 0
  maxReplicaCount: 10
  jobTargetRef:
    template:
      spec:
        ttlSecondsAfterFinished: 300
        backoffLimit: 0
        template:
          spec:
            restartPolicy: Never
            containers:
              - name: hellotest-execution-engine
                image: hellotest/hellotest-execution-engine:latest
                imagePullPolicy: IfNotPresent
                env:
                  - name: ENGINE_ID
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.name
                  - name: BACKEND_URL
                    value: "http://hellotest-backend:3000"
                  - name: REDIS_URL
                    value: "redis://redis:6379"
                  - name: MINIO_ENDPOINT
                    value: "minio"
                  - name: MINIO_PORT
                    value: "9000"
                  - name: MINIO_USE_TLS
                    value: "false"
                  - name: MINIO_ACCESS_KEY
                    valueFrom:
                      secretKeyRef:
                        name: hellotest-minio-credentials
                        key: accesskey
                  - name: MINIO_SECRET_KEY
                    valueFrom:
                      secretKeyRef:
                        name: hellotest-minio-credentials
                        key: secretkey
                  - name: MINIO_BUCKET
                    value: "hellotest-artifacts"
                  - name: OTEL_EXPORTER_OTLP_ENDPOINT
                    value: "http://otel-collector:4318/v1/traces"
                  - name: QUEUE_NAME
                    value: "hellotest-engine-runs"
                  - name: PARALLEL_ENABLED
                    value: "true"
                  - name: PARALLEL_COUNT
                    value: "2"
                  - name: HEARTBEAT_INTERVAL_SECONDS
                    value: "12"
  triggers:
    - type: redis
      metadata:
        address: redis:6379
        listName: bull:hellotest-engine-runs:wait
        listLength: "5"
        listLengthFrom: "0"
      authenticationRef:
        name: hellotest-redis-auth
