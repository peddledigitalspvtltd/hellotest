apiVersion: batch/v1
kind: Job
metadata:
  name: qaira-execution-engine-job
  labels:
    app: qaira-execution-engine
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: qaira-execution-engine
    spec:
      restartPolicy: Never
      containers:
        - name: qaira-execution-engine
          image: qaira/qaira-execution-engine:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: ENGINE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: BACKEND_URL
              value: "http://qaira-backend:3000"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: MINIO_ENDPOINT
              value: "minio"
            - name: MINIO_PORT
              value: "9000"
            - name: MINIO_USE_TLS
              value: "false"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: qaira-minio-credentials
                  key: accesskey
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: qaira-minio-credentials
                  key: secretkey
            - name: MINIO_BUCKET
              value: "qaira-artifacts"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4318/v1/traces"
            - name: QUEUE_NAME
              value: "qaira-engine-runs"
            - name: PARALLEL_ENABLED
              value: "true"
            - name: PARALLEL_COUNT
              value: "2"
            - name: HEARTBEAT_INTERVAL_SECONDS
              value: "12"
