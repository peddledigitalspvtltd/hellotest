services:
  redis:
    image: redis:7.4-alpine
    container_name: hellotest-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - hellotest-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: always

  postgres:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    container_name: hellotest-postgres
    ports:
      - "5432:5432"
    volumes:
      - hellotest-postgres-data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hellotest}
      POSTGRES_USER: ${POSTGRES_USER:-hellotest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hellotest}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hellotest} -d ${POSTGRES_DB:-hellotest}"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: hellotest-qdrant
    ports:
      - "${QDRANT_BIND:-127.0.0.1}:${QDRANT_PORT:-6333}:6333"
    volumes:
      - hellotest-qdrant-data:/qdrant/storage
    restart: always

  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z}
    container_name: hellotest-minio
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hellotest}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-hellotest-minio-dev-secret}
    volumes:
      - hellotest-minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: always

  tika:
    image: apache/tika:3.3.0.0
    container_name: hellotest-tika
    expose:
      - "9998"
    networks:
      - knowledge-parser
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 4g
    cpus: 2.0
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9998 && printf \"GET /version HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: always

  api:
    build: ./backend/api
    image: ${HELLOTEST_BACKEND_IMAGE:-jayarajumetta/hellotest-backend:latest}
    container_name: hellotest-api
    ports:
      - "3000:3000"
    environment:
      APP_MODE: ${APP_MODE:-docker}
      API_STARTUP_TIMEOUT_MS: ${API_STARTUP_TIMEOUT_MS:-180000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://hellotest:hellotest@postgres:5432/hellotest}
      OBS_DATABASE_URL: ${OBS_DATABASE_URL:-postgresql://hellotest:hellotest@postgres:5432/hellotest}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SESSION_SECRET: ${SESSION_SECRET:-hellotest-dev-secret}
      MOBILE_ENGINE_SHARED_SECRET: ${MOBILE_ENGINE_SHARED_SECRET:-hellotest-mobile-engine-dev-secret}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080,http://localhost:8081,http://localhost:5173,http://localhost:5174}
      ADMIN_PORTAL_PORT: ${ADMIN_PORTAL_PORT:-8081}
      ADMIN_FRONTEND_INTERNAL_URL: ${ADMIN_FRONTEND_INTERNAL_URL:-http://frontend:81}
      ADMIN_BOOTSTRAP_ENABLED: ${ADMIN_BOOTSTRAP_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-hellotest-api}
      ENABLE_OBSERVABILITY: ${ENABLE_OBSERVABILITY:-true}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-minio}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-hellotest}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-hellotest-minio-dev-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-hellotest-attachments}
      MAX_ATTACHMENT_BYTES: ${MAX_ATTACHMENT_BYTES:-104857600}
      KNOWLEDGE_MAX_FILE_BYTES: ${KNOWLEDGE_MAX_FILE_BYTES:-52428800}
      KNOWLEDGE_EXTRACTION_MAX_BYTES: ${KNOWLEDGE_EXTRACTION_MAX_BYTES:-20971520}
      KNOWLEDGE_MAX_EXTRACTED_TEXT_CHARS: ${KNOWLEDGE_MAX_EXTRACTED_TEXT_CHARS:-2000000}
      KNOWLEDGE_TIKA_URL: ${KNOWLEDGE_TIKA_URL:-http://tika:9998}
      KNOWLEDGE_TIKA_TIMEOUT_MS: ${KNOWLEDGE_TIKA_TIMEOUT_MS:-30000}
      KNOWLEDGE_VECTOR_STORE: ${KNOWLEDGE_VECTOR_STORE:-qdrant}
      KNOWLEDGE_QDRANT_URL: ${KNOWLEDGE_QDRANT_URL:-http://qdrant:6333}
      KNOWLEDGE_QDRANT_API_KEY: ${KNOWLEDGE_QDRANT_API_KEY:-}
      KNOWLEDGE_QDRANT_COLLECTION_PREFIX: ${KNOWLEDGE_QDRANT_COLLECTION_PREFIX:-hellotest_knowledge_dense_v1}
      KNOWLEDGE_QDRANT_TIMEOUT_MS: ${KNOWLEDGE_QDRANT_TIMEOUT_MS:-4000}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_healthy
      tika:
        condition: service_healthy
    networks:
      - default
      - knowledge-parser
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/health/ready >/dev/null 2>&1 || exit 1"]
      start_period: ${API_STARTUP_TIMEOUT_MS:-180000}ms
      interval: 15s
      timeout: 5s
      retries: 10
    restart: always

  frontend:
    build: ./frontend
    image: ${HELLOTEST_FRONTEND_IMAGE:-jayarajumetta/hellotest-frontend:latest}
    container_name: hellotest-frontend
    ports:
      - "8080:80"
      - "${HELLOTEST_ADMIN_PORT:-8081}:81"
    environment:
      HELLOTEST_API_BASE_URL: ${HELLOTEST_API_BASE_URL:-/api}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1 >/dev/null 2>&1 && wget -q -O - http://127.0.0.1:81 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: always

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
    container_name: hellotest-jaeger
    ports:
      - "${JAEGER_BIND:-127.0.0.1}:16686:16686"
      - "${JAEGER_OTLP_BIND:-127.0.0.1}:4318:4318"
    restart: always

  testengine:
    image: ${HELLOTEST_TESTENGINE_IMAGE:-jayarajumetta/hellotest-testengine:latest}
    container_name: hellotest-testengine
    ports:
      - "${TESTENGINE_BIND:-127.0.0.1}:${TESTENGINE_PORT:-4301}:4301"
    environment:
      PORT: 4301
      NODE_ENV: ${TESTENGINE_NODE_ENV:-development}
      ENGINE_NAME: HelloTest Test Engine
      RECORDER_MAX_INSPECTION_SESSIONS: ${RECORDER_MAX_INSPECTION_SESSIONS:-6}
      RECORDER_ALLOWED_PRIVATE_HOSTS: ${RECORDER_ALLOWED_PRIVATE_HOSTS:-}
      TESTENGINE_WORKER_CLASS: web
      ARTIFACT_ROOT: /artifacts
      HELLOTEST_API_BASE_URL: ${HELLOTEST_WORKER_API_BASE_URL:-http://api:3000}
      HELLOTEST_TESTENGINE_SECRET: ${HELLOTEST_TESTENGINE_SECRET:-hellotest-testengine-dev-secret}
      TESTENGINE_SHARED_SECRET: ${TESTENGINE_SHARED_SECRET:-hellotest-testengine-dev-secret}
      MOBILE_ENGINE_SHARED_SECRET: ${MOBILE_ENGINE_SHARED_SECRET:-hellotest-mobile-engine-dev-secret}
      ENGINE_PUBLIC_URL: ${ENGINE_PUBLIC_URL:-http://localhost:4301}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TESTENGINE_CORS_ORIGINS: ${TESTENGINE_CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME_TESTENGINE:-hellotest-testengine}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES_TESTENGINE:-service.name=hellotest-testengine}
      OPS_TELEMETRY_ENABLED: ${OPS_TELEMETRY_ENABLED:-true}
      OPS_TELEMETRY_EVENTS_PATH: ${OPS_TELEMETRY_EVENTS_PATH:-/api/v1/events}
      OPS_TELEMETRY_BOARD_PATH: ${OPS_TELEMETRY_BOARD_PATH:-/ops-telemetry}
      OPS_TELEMETRY_SERVICE_NAME: ${OPS_TELEMETRY_SERVICE_NAME:-hellotest-testengine}
      OPS_TELEMETRY_ENVIRONMENT: ${OPS_TELEMETRY_ENVIRONMENT:-local}
      OPS_TELEMETRY_STORE_PATH: ${OPS_TELEMETRY_STORE_PATH:-/artifacts/ops-telemetry-events.ndjson}
      OPS_TELEMETRY_MAX_EVENTS: ${OPS_TELEMETRY_MAX_EVENTS:-2000}
    volumes:
      - hellotest-testengine-artifacts:/artifacts
    depends_on:
      api:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4301/health/ready').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));\""]
      interval: 15s
      timeout: 10s
      retries: 10
    stop_grace_period: 35s
    restart: always
networks:
  knowledge-parser:
    internal: true

volumes:
  hellotest-redis-data:
  hellotest-postgres-data:
  hellotest-testengine-artifacts:
  hellotest-minio-data:
  hellotest-qdrant-data:
