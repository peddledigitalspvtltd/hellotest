service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    resource:
      service.name: jaeger
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
    logs:
      level: info

extensions:
  healthcheckv2:
    use_v2: true
    http:
      endpoint: 0.0.0.0:13133
  jaeger_query:
    storage:
      traces: primary_store
      traces_archive: archive_store
    http:
      endpoint: 0.0.0.0:16686
  jaeger_storage:
    backends:
      primary_store:
        badger:
          directories:
            keys: /badger/primary
            values: /badger/primary
          ephemeral: false
          ttl:
            spans: 336h
          metrics_update_interval: 10s
      archive_store:
        badger:
          directories:
            keys: /badger/archive
            values: /badger/archive
          ephemeral: false
          ttl:
            spans: 2160h
          metrics_update_interval: 10s

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    send_batch_size: 1024
    send_batch_max_size: 2048
    timeout: 5s

exporters:
  jaeger_storage_exporter:
    trace_storage: primary_store
