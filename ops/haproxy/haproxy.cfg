global
  log stdout format raw local0
  maxconn 512

defaults
  log global
  mode http
  option httplog
  option forwardfor
  timeout connect 5s
  timeout client 60s
  timeout server 60s

resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 2
  timeout retry 1s
  hold valid 5s

frontend hellotest_public
  bind *:80
  timeout client 210s
  http-request set-header X-Forwarded-Proto http
  acl hellotest_api path_beg /api /health /metrics
  use_backend hellotest_api if hellotest_api
  default_backend hellotest_frontend

backend hellotest_api
  balance roundrobin
  timeout server 210s
  http-request replace-path ^/api/?(.*) /\1 if { path_beg /api }
  option httpchk GET /health/ready
  http-check expect status 200
  server api api:3000 check resolvers docker init-addr none

backend hellotest_frontend
  balance roundrobin
  option httpchk GET /
  http-check expect status 200
  server frontend frontend:80 check resolvers docker init-addr none

frontend haproxy_stats
  bind *:8404
  http-request use-service prometheus-exporter if { path /metrics }
  monitor-uri /health
  stats enable
  stats uri /stats
  stats refresh 10s
  stats show-node
