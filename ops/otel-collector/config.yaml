extensions:
  health_check:
    endpoint: 0.0.0.0:13133
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 48
  attributes/redact:
    actions:
    - key: http.request.header.authorization
      action: delete
    - key: http.request.header.cookie
      action: delete
    - key: http.response.header.set-cookie
      action: delete
    - key: db.connection_string
      action: delete
    - key: db.statement
      action: delete
    - key: db.query.text
      action: delete
    - key: url.query
      action: delete
    - key: http.request.body
      action: delete
    - key: http.response.body
      action: delete
    - key: http.request.header.x-api-key
      action: delete
    - key: gen_ai.prompt
      action: delete
    - key: gen_ai.completion
      action: delete
    - key: messaging.message.body
      action: delete
    - key: enduser.id
      action: delete
    - key: user.id
      action: delete
  batch:
    send_batch_size: 128
    send_batch_max_size: 256
    timeout: 5s
exporters:
  otlphttp/jaeger:
    endpoint: http://jaeger:4318
    compression: gzip
    timeout: 3s
    sending_queue:
      enabled: true
      sizer: bytes
      queue_size: 4194304
      num_consumers: 2
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 30s
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    compression: gzip
    timeout: 3s
    sending_queue:
      enabled: true
      sizer: bytes
      queue_size: 4194304
      num_consumers: 2
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 30s
  prometheus:
    endpoint: 0.0.0.0:9464
    enable_open_metrics: true
service:
  extensions:
  - health_check
  pipelines:
    traces:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - attributes/redact
      - batch
      exporters:
      - otlphttp/jaeger
    metrics:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - batch
      exporters:
      - prometheus
    logs:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - attributes/redact
      - batch
      exporters:
      - otlphttp/loki
  telemetry:
    logs:
      level: info
      encoding: json
    metrics:
      level: detailed
      readers:
      - pull:
          exporter:
            prometheus:
              host: 0.0.0.0
              port: 8888
