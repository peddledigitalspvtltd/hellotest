global:
  scrape_interval: 30s
  scrape_timeout: 5s
  evaluation_interval: 30s
  external_labels:
    environment: platform
alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - alertmanager:9093
rule_files:
- /etc/prometheus/alerts.yml
scrape_configs:
- job_name: hellotest-api
  metrics_path: /metrics
  scrape_timeout: 5s
  static_configs:
  - targets:
    - api:3000
  sample_limit: 10000
  label_limit: 30
  label_value_length_limit: 256
- job_name: otel-pipeline
  static_configs:
  - targets:
    - otel-collector:9464
  sample_limit: 10000
  label_limit: 30
  label_value_length_limit: 256
- job_name: otel-collector
  static_configs:
  - targets:
    - otel-collector:8888
  sample_limit: 10000
  label_limit: 30
  label_value_length_limit: 256
- job_name: loki
  static_configs:
  - targets:
    - loki:3100
  sample_limit: 10000
  label_limit: 30
  label_value_length_limit: 256
- job_name: alloy
  static_configs:
  - targets:
    - alloy:12345
  sample_limit: 10000
  label_limit: 30
  label_value_length_limit: 256
- job_name: jaeger
  static_configs:
  - targets:
    - jaeger:8888
  sample_limit: 10000
  label_limit: 30
  label_value_length_limit: 256
- job_name: haproxy
  metrics_path: /metrics
  static_configs:
  - targets:
    - haproxy:8404
  sample_limit: 10000
  label_limit: 30
  label_value_length_limit: 256
- job_name: alertmanager
  static_configs:
  - targets:
    - alertmanager:9093
  sample_limit: 10000
  label_limit: 30
  label_value_length_limit: 256
- job_name: prometheus
  static_configs:
  - targets:
    - localhost:9090
  sample_limit: 10000
  label_limit: 30
  label_value_length_limit: 256
