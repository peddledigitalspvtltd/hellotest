services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    container_name: hellotest-local-postgres
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - hellotest-local-postgres-data:/var/lib/postgresql/data
      - ../services/platform/backend/instance-setup-data/schema-setup/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/03-local-integrations.sql:/docker-entrypoint-initdb.d/03-local-integrations.sql:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hellotest}
      POSTGRES_USER: ${POSTGRES_USER:-hellotest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hellotest}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hellotest} -d ${POSTGRES_DB:-hellotest}"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: hellotest-local-qdrant
    ports:
      - "${QDRANT_BIND:-127.0.0.1}:${QDRANT_PORT:-6333}:6333"
    volumes:
      - hellotest-local-qdrant-data:/qdrant/storage

  redis:
    image: redis:7.4-alpine
    container_name: hellotest-local-redis
    ports:
      - "${REDIS_BIND:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: ${MINIO_IMAGE:-hellotest/minio:RELEASE.2025-10-15T17-29-55Z}
    pull_policy: missing
    container_name: hellotest-local-minio
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_BIND:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_BIND:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hellotest}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-hellotest-minio-dev-secret}
    volumes:
      - hellotest-local-minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  tika:
    image: apache/tika:3.3.0.0
    container_name: hellotest-local-tika
    expose:
      - "9998"
    networks:
      - knowledge-parser
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 4g
    cpus: 2.0
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9998 && printf \"GET /version HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
    container_name: hellotest-local-jaeger
    profiles: [legacy-tracing]
    mem_limit: 256m
    cpus: 0.5
    command: ["--config=/etc/jaeger/config.yaml"]
    volumes:
      - ../ops/jaeger/config.yaml:/etc/jaeger/config.yaml:ro
    ports:
      - "${JAEGER_BIND:-127.0.0.1}:16686:16686"
      - "${JAEGER_OTLP_BIND:-127.0.0.1}:4318:4318"

  api:
    build:
      context: ..
      dockerfile: services/platform/backend/Dockerfile
      args:
        HELLOTEST_DEBUG_SOURCEMAPS: "true"
    container_name: hellotest-local-api
    restart: unless-stopped
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-3000}:3000"
    environment:
      APP_MODE: ${APP_MODE:-local}
      API_STARTUP_TIMEOUT_MS: ${API_STARTUP_TIMEOUT_MS:-180000}
      HELLOTEST_INSTANCE_SETUP_MODULES: ${HELLOTEST_INSTANCE_SETUP_MODULES:-}
      HELLOTEST_ENABLED_CAPABILITIES: ${HELLOTEST_ENABLED_CAPABILITIES:-all}
      DATABASE_URL: ${DATABASE_URL:-postgresql://hellotest:hellotest@postgres:5432/hellotest}
      OBS_DATABASE_URL: ${OBS_DATABASE_URL:-postgresql://hellotest:hellotest@postgres:5432/hellotest}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://hellotest-ops-otel-collector:4318}
      OTEL_SERVICE_NAME: "hellotest-api"
      ENABLE_OBSERVABILITY: ${ENABLE_OBSERVABILITY:-true}
      OPS_MONITORING_ENABLED: ${OPS_MONITORING_ENABLED:-true}
      OPS_GRAFANA_USER: ${OPS_GRAFANA_USER:-admin}
      OPS_GRAFANA_PASSWORD: ${OPS_GRAFANA_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-hellotest-local-dev-secret}
      WORKFLOW_CREDENTIAL_KEY: ${WORKFLOW_CREDENTIAL_KEY:-}
      HELLOTEST_MCP_PUBLIC_URL: ${HELLOTEST_MCP_PUBLIC_URL:-}
      HELLOTEST_MCP_ALLOWED_HOSTS: ${HELLOTEST_MCP_ALLOWED_HOSTS:-}
      HELLOTEST_MCP_SIGNING_KEY: ${HELLOTEST_MCP_SIGNING_KEY:-}
      HELLOTEST_MCP_DATABASE_URL: ${HELLOTEST_MCP_DATABASE_URL:-}
      HELLOTEST_MCP_MAX_CONCURRENT: ${HELLOTEST_MCP_MAX_CONCURRENT:-16}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080,http://localhost:5173}
      ADMIN_PORTAL_PORT: ${ADMIN_PORTAL_PORT:-8081}
      ADMIN_FRONTEND_INTERNAL_URL: ${ADMIN_FRONTEND_INTERNAL_URL:-http://frontend:81}
      HELLOTEST_LOCAL_RUN_ENGINE_URL: ${HELLOTEST_LOCAL_RUN_ENGINE_URL:-http://host.docker.internal:4311}
      HELLOTEST_LOCAL_CALLBACK_BASE_URL: ${HELLOTEST_LOCAL_CALLBACK_BASE_URL:-${HELLOTEST_PUBLIC_API_BASE_URL:-http://localhost:8080}}
      HELLOTEST_TESTENGINE_SECRET: ${HELLOTEST_TESTENGINE_SECRET:-hellotest-testengine-dev-secret}
      TESTENGINE_SHARED_SECRET: ${TESTENGINE_SHARED_SECRET:-hellotest-testengine-dev-secret}
      MOBILE_ENGINE_SHARED_SECRET: ${MOBILE_ENGINE_SHARED_SECRET:-hellotest-mobile-engine-dev-secret}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-minio}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-hellotest}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-hellotest-minio-dev-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-hellotest-attachments}
      MAX_ATTACHMENT_BYTES: ${MAX_ATTACHMENT_BYTES:-104857600}
      KNOWLEDGE_MAX_FILE_BYTES: ${KNOWLEDGE_MAX_FILE_BYTES:-52428800}
      KNOWLEDGE_EXTRACTION_MAX_BYTES: ${KNOWLEDGE_EXTRACTION_MAX_BYTES:-20971520}
      KNOWLEDGE_MAX_EXTRACTED_TEXT_CHARS: ${KNOWLEDGE_MAX_EXTRACTED_TEXT_CHARS:-2000000}
      KNOWLEDGE_TIKA_URL: ${KNOWLEDGE_TIKA_URL:-http://tika:9998}
      KNOWLEDGE_TIKA_TIMEOUT_MS: ${KNOWLEDGE_TIKA_TIMEOUT_MS:-30000}
      KNOWLEDGE_VECTOR_STORE: ${KNOWLEDGE_VECTOR_STORE:-qdrant}
      KNOWLEDGE_QDRANT_URL: ${KNOWLEDGE_QDRANT_URL:-http://qdrant:6333}
      KNOWLEDGE_QDRANT_API_KEY: ${KNOWLEDGE_QDRANT_API_KEY:-}
      KNOWLEDGE_QDRANT_COLLECTION_PREFIX: ${KNOWLEDGE_QDRANT_COLLECTION_PREFIX:-hellotest_knowledge_dense_v1}
      KNOWLEDGE_QDRANT_TIMEOUT_MS: ${KNOWLEDGE_QDRANT_TIMEOUT_MS:-4000}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      tika:
        condition: service_healthy
    networks:
      - default
      - knowledge-parser
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/health/ready >/dev/null 2>&1 || exit 1"]
      start_period: ${API_STARTUP_TIMEOUT_MS:-180000}ms
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ..
      dockerfile: services/platform/frontend/Dockerfile
      args:
        HELLOTEST_DEBUG_SOURCEMAPS: "true"
    container_name: hellotest-local-frontend
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-8080}:80"
      - "${ADMIN_BIND:-127.0.0.1}:${HELLOTEST_ADMIN_PORT:-8081}:81"
    environment:
      HELLOTEST_API_BASE_URL: ${HELLOTEST_API_BASE_URL:-/api}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1 >/dev/null 2>&1 && wget -q -O - http://127.0.0.1:81 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  testengine-api-worker:
    build:
      context: ../testengine/backend
      dockerfile: Dockerfile
    expose:
      - "4301"
    environment:
      PORT: 4301
      NODE_ENV: development
      ENGINE_NAME: hellotest-local-testengine-api-worker
      TESTENGINE_WORKER_CLASS: api
      ENGINE_PUBLIC_URL: ${ENGINE_PUBLIC_URL:-http://localhost:4301}
      HELLOTEST_API_BASE_URL: ${HELLOTEST_WORKER_API_BASE_URL:-http://api:3000}
      HELLOTEST_TESTENGINE_SECRET: ${HELLOTEST_TESTENGINE_SECRET:-hellotest-testengine-dev-secret}
      TESTENGINE_SHARED_SECRET: ${TESTENGINE_SHARED_SECRET:-hellotest-testengine-dev-secret}
      TESTENGINE_POLL_INTERVAL_MS: ${TESTENGINE_API_POLL_INTERVAL_MS:-1000}
      TESTENGINE_POLL_CONCURRENCY: ${TESTENGINE_API_POLL_CONCURRENCY:-8}
      ARTIFACT_ROOT: ${ARTIFACT_ROOT:-/artifacts}
      RECORDER_HEADLESS: ${RECORDER_HEADLESS:-true}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      OTEL_SERVICE_NAME: "hellotest-testengine-api"
    volumes:
      - hellotest-local-testengine-artifacts:/artifacts
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:4301/health/ready >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    stop_grace_period: 35s
    deploy:
      replicas: ${TESTENGINE_API_REPLICAS:-1}

  testengine-web-worker:
    build:
      context: ../testengine/backend
      dockerfile: Dockerfile
    expose:
      - "4301"
    environment:
      PORT: 4301
      NODE_ENV: development
      ENGINE_NAME: hellotest-local-testengine-web-worker
      RECORDER_MAX_INSPECTION_SESSIONS: ${RECORDER_MAX_INSPECTION_SESSIONS:-6}
      RECORDER_ALLOWED_PRIVATE_HOSTS: ${RECORDER_ALLOWED_PRIVATE_HOSTS:-}
      TESTENGINE_WORKER_CLASS: web
      ENGINE_PUBLIC_URL: ${ENGINE_PUBLIC_URL:-http://localhost:4301}
      HELLOTEST_API_BASE_URL: ${HELLOTEST_WORKER_API_BASE_URL:-http://api:3000}
      HELLOTEST_TESTENGINE_SECRET: ${HELLOTEST_TESTENGINE_SECRET:-hellotest-testengine-dev-secret}
      TESTENGINE_SHARED_SECRET: ${TESTENGINE_SHARED_SECRET:-hellotest-testengine-dev-secret}
      TESTENGINE_POLL_INTERVAL_MS: ${TESTENGINE_WEB_POLL_INTERVAL_MS:-1000}
      TESTENGINE_POLL_CONCURRENCY: ${TESTENGINE_WEB_POLL_CONCURRENCY:-2}
      ARTIFACT_ROOT: ${ARTIFACT_ROOT:-/artifacts}
      RECORDER_HEADLESS: ${RECORDER_HEADLESS:-true}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      OTEL_SERVICE_NAME: "hellotest-testengine-web"
    volumes:
      - hellotest-local-testengine-artifacts:/artifacts
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:4301/health/ready >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    stop_grace_period: 35s
    deploy:
      replicas: ${TESTENGINE_WEB_REPLICAS:-1}

  testengine-quality-worker:
    build:
      context: ../testengine/backend
      dockerfile: Dockerfile
    expose:
      - "4301"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 4301
      NODE_ENV: development
      ENGINE_NAME: hellotest-local-quality-worker
      TESTENGINE_SHARED_SECRET: ${TESTENGINE_SHARED_SECRET:-hellotest-testengine-dev-secret}
      TESTENGINE_QUEUE_REQUIRED: "false"
      QUALITY_AGENT_DATA_DIR: /quality-data
      QUALITY_AGENT_ALLOWED_PRIVATE_HOSTS: ${QUALITY_AGENT_ALLOWED_PRIVATE_HOSTS:-}
      QUALITY_AGENT_ALLOWED_ORIGINS: ${QUALITY_AGENT_ALLOWED_ORIGINS:-}
      QUALITY_AGENT_CREDENTIAL_REFERENCES: ${QUALITY_AGENT_CREDENTIAL_REFERENCES:-[]}
      QUALITY_AGENT_RETENTION_DAYS: ${QUALITY_AGENT_RETENTION_DAYS:-7}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      OTEL_SERVICE_NAME: hellotest-quality-agents
    volumes:
      - hellotest-local-quality-data:/quality-data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:4301/health/ready >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    stop_grace_period: 35s
    deploy:
      replicas: 1

  testengine-android-worker:
    build:
      context: ../testengine/backend
      dockerfile: Dockerfile
    expose:
      - "4301"
    environment:
      PORT: 4301
      NODE_ENV: development
      ENGINE_NAME: hellotest-local-testengine-android-worker
      TESTENGINE_WORKER_CLASS: android
      ENGINE_PUBLIC_URL: ${ENGINE_PUBLIC_URL:-http://localhost:4301}
      HELLOTEST_API_BASE_URL: ${HELLOTEST_WORKER_API_BASE_URL:-http://api:3000}
      HELLOTEST_TESTENGINE_SECRET: ${HELLOTEST_TESTENGINE_SECRET:-hellotest-testengine-dev-secret}
      TESTENGINE_SHARED_SECRET: ${TESTENGINE_SHARED_SECRET:-hellotest-testengine-dev-secret}
      MOBILE_ENGINE_URL: ${MOBILE_ENGINE_URL:-http://mobile-engine:4312}
      MOBILE_ENGINE_SHARED_SECRET: ${MOBILE_ENGINE_SHARED_SECRET:-hellotest-mobile-engine-dev-secret}
      TESTENGINE_POLL_INTERVAL_MS: ${TESTENGINE_ANDROID_POLL_INTERVAL_MS:-1000}
      TESTENGINE_POLL_CONCURRENCY: ${TESTENGINE_ANDROID_POLL_CONCURRENCY:-1}
      ARTIFACT_ROOT: ${ARTIFACT_ROOT:-/artifacts}
      RECORDER_HEADLESS: ${RECORDER_HEADLESS:-true}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      OTEL_SERVICE_NAME: "hellotest-testengine-android"
    volumes:
      - hellotest-local-testengine-artifacts:/artifacts
    depends_on:
      api:
        condition: service_healthy
      mobile-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:4301/health/ready >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    stop_grace_period: 35s
    deploy:
      replicas: ${TESTENGINE_ANDROID_REPLICAS:-1}

  testengine:
    image: haproxy:2.9-alpine
    container_name: hellotest-local-testengine
    ports:
      - "${TESTENGINE_BIND:-127.0.0.1}:${TESTENGINE_PORT:-4301}:4301"
    volumes:
      - ./testengine-gateway/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      testengine-quality-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:4301/health/ready >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  mobile-engine:
    build:
      context: ./mobile-engine
      dockerfile: Dockerfile
    container_name: hellotest-local-mobile-engine
    ports:
      - "${MOBILE_ENGINE_BIND:-127.0.0.1}:${MOBILE_ENGINE_PORT:-4312}:4312"
    environment:
      PORT: 4312
      NODE_ENV: development
      MOBILE_ENGINE_SHARED_SECRET: ${MOBILE_ENGINE_SHARED_SECRET:-hellotest-mobile-engine-dev-secret}
      MOBILE_PROVIDER: ${MOBILE_PROVIDER:-local-appium}
      MOBILE_REMOTE_URL: ${MOBILE_REMOTE_URL:-}
      APPIUM_SERVER_URL: ${APPIUM_SERVER_URL:-http://host.docker.internal:4723}
      ANDROID_DEVICE_NAME: ${ANDROID_DEVICE_NAME:-Android Device}
      ANDROID_PLATFORM_VERSION: ${ANDROID_PLATFORM_VERSION:-}
      ANDROID_APP: ${ANDROID_APP:-}
      MOBILE_READINESS_TIMEOUT_MS: ${MOBILE_READINESS_TIMEOUT_MS:-2000}
      MOBILE_REQUIRE_PROVIDER_READY: ${MOBILE_REQUIRE_PROVIDER_READY:-false}
      MOBILE_REMOTE_DOWNLOAD_TIMEOUT_MS: ${MOBILE_REMOTE_DOWNLOAD_TIMEOUT_MS:-15000}
      MOBILE_REMOTE_DOWNLOAD_MAX_BYTES: ${MOBILE_REMOTE_DOWNLOAD_MAX_BYTES:-26214400}
      MOBILE_SHUTDOWN_TIMEOUT_MS: ${MOBILE_SHUTDOWN_TIMEOUT_MS:-10000}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4312/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  knowledge-parser:
    internal: true

volumes:
  hellotest-local-postgres-data:
  hellotest-local-testengine-artifacts:
  hellotest-local-quality-data:
  hellotest-local-minio-data:
  hellotest-local-qdrant-data:
