global
  log stdout format raw local0
  maxconn 2048

defaults
  mode http
  log global
  option httplog
  option http-keep-alive
  timeout connect 5s
  timeout check 5s
  timeout client 10m
  timeout server 10m
  default-server inter 5s fall 3 rise 2

resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout retry 1s
  hold valid 5s

frontend testengine_http
  bind *:4301
  # Quality runs and reviewed baselines own durable state in one worker.
  acl quality_agents path_beg /api/v1/quality-agents
  use_backend testengine_quality if quality_agents
  default_backend testengine_workers

backend testengine_quality
  option httpchk GET /health/ready
  http-check expect status 200
  server quality testengine-quality-worker:4301 check resolvers docker init-addr none

backend testengine_workers
  balance leastconn
  cookie HELLOTEST_ENGINE insert indirect nocache dynamic
  dynamic-cookie-key hellotest-recorder-session-affinity
  option httpchk GET /health/ready
  http-check expect status 200
  # Resolve each slot through Docker DNS instead of initially assigning every
  # slot the same libc address (and therefore the same affinity cookie).
  server-template worker 5 testengine-web-worker:4301 check resolvers docker init-addr none
