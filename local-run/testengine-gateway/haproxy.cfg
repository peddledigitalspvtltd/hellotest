global
  log stdout format raw local0
  maxconn 2048

defaults
  mode http
  log global
  option httplog
  option http-keep-alive
  timeout connect 5s
  timeout client 10m
  timeout server 10m

resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout retry 1s
  hold valid 5s

frontend testengine_http
  bind *:4301
  default_backend testengine_workers

backend testengine_workers
  balance leastconn
  option httpchk GET /health/ready
  http-check expect status 200
  server-template worker 5 testengine-web-worker:4301 check resolvers docker init-addr libc,none
