services:
  postgres:
    image: postgres:16-alpine
    container_name: qaira-local-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - qaira-local-postgres-data:/var/lib/postgresql/data
      - ../backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../backend/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./db/03-local-integrations.sql:/docker-entrypoint-initdb.d/03-local-integrations.sql:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qaira}
      POSTGRES_USER: ${POSTGRES_USER:-qaira}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qaira}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qaira} -d ${POSTGRES_DB:-qaira}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: qaira-local-minio
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-qaira}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-qaira-minio-dev-secret}
    volumes:
      - qaira-local-minio-data:/data

  api:
    image: ${QAIRA_BACKEND_IMAGE:-jayarajumetta/qaira-backend:latest}
    container_name: qaira-local-api
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://qaira:qaira@postgres:5432/qaira}
      SESSION_SECRET: ${SESSION_SECRET:-qaira-local-dev-secret}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080,http://localhost:5173}
      QAIRA_TESTENGINE_SECRET: ${QAIRA_TESTENGINE_SECRET:-qaira-testengine-dev-secret}
      TESTENGINE_SHARED_SECRET: ${TESTENGINE_SHARED_SECRET:-qaira-testengine-dev-secret}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-minio}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-qaira}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-qaira-minio-dev-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-qaira-attachments}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MAX_ATTACHMENT_BYTES: ${MAX_ATTACHMENT_BYTES:-104857600}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    image: ${QAIRA_FRONTEND_IMAGE:-jayarajumetta/qaira-frontend:latest}
    container_name: qaira-local-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    environment:
      QAIRA_API_BASE_URL: ${QAIRA_API_BASE_URL:-/api}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  testengine-api-worker:
    image: ${QAIRA_TESTENGINE_IMAGE:-jayarajumetta/qaira-testengine:latest}
    expose:
      - "4301"
    environment:
      PORT: 4301
      ENGINE_NAME: qaira-local-testengine-api-worker
      TESTENGINE_WORKER_CLASS: api
      ENGINE_PUBLIC_URL: ${ENGINE_PUBLIC_URL:-http://localhost:4301}
      QAIRA_API_BASE_URL: ${QAIRA_WORKER_API_BASE_URL:-http://api:3000}
      QAIRA_TESTENGINE_SECRET: ${QAIRA_TESTENGINE_SECRET:-qaira-testengine-dev-secret}
      TESTENGINE_SHARED_SECRET: ${TESTENGINE_SHARED_SECRET:-qaira-testengine-dev-secret}
      TESTENGINE_POLL_INTERVAL_MS: ${TESTENGINE_API_POLL_INTERVAL_MS:-1000}
      TESTENGINE_POLL_CONCURRENCY: ${TESTENGINE_API_POLL_CONCURRENCY:-8}
      ARTIFACT_ROOT: ${ARTIFACT_ROOT:-/artifacts}
      RECORDER_HEADLESS: ${RECORDER_HEADLESS:-true}
    volumes:
      - qaira-local-testengine-artifacts:/artifacts
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:4301/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      replicas: ${TESTENGINE_API_REPLICAS:-0}

  testengine-web-worker:
    image: ${QAIRA_TESTENGINE_IMAGE:-jayarajumetta/qaira-testengine:latest}
    expose:
      - "4301"
    environment:
      PORT: 4301
      ENGINE_NAME: qaira-local-testengine-web-worker
      TESTENGINE_WORKER_CLASS: web
      ENGINE_PUBLIC_URL: ${ENGINE_PUBLIC_URL:-http://localhost:4301}
      QAIRA_API_BASE_URL: ${QAIRA_WORKER_API_BASE_URL:-http://api:3000}
      QAIRA_TESTENGINE_SECRET: ${QAIRA_TESTENGINE_SECRET:-qaira-testengine-dev-secret}
      TESTENGINE_SHARED_SECRET: ${TESTENGINE_SHARED_SECRET:-qaira-testengine-dev-secret}
      TESTENGINE_POLL_INTERVAL_MS: ${TESTENGINE_WEB_POLL_INTERVAL_MS:-1000}
      TESTENGINE_POLL_CONCURRENCY: ${TESTENGINE_WEB_POLL_CONCURRENCY:-2}
      ARTIFACT_ROOT: ${ARTIFACT_ROOT:-/artifacts}
      RECORDER_HEADLESS: ${RECORDER_HEADLESS:-true}
    volumes:
      - qaira-local-testengine-artifacts:/artifacts
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:4301/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      replicas: ${TESTENGINE_WEB_REPLICAS:-0}

  testengine-android-worker:
    image: ${QAIRA_TESTENGINE_IMAGE:-jayarajumetta/qaira-testengine:latest}
    expose:
      - "4301"
    environment:
      PORT: 4301
      ENGINE_NAME: qaira-local-testengine-android-worker
      TESTENGINE_WORKER_CLASS: android
      ENGINE_PUBLIC_URL: ${ENGINE_PUBLIC_URL:-http://localhost:4301}
      QAIRA_API_BASE_URL: ${QAIRA_WORKER_API_BASE_URL:-http://api:3000}
      QAIRA_TESTENGINE_SECRET: ${QAIRA_TESTENGINE_SECRET:-qaira-testengine-dev-secret}
      TESTENGINE_SHARED_SECRET: ${TESTENGINE_SHARED_SECRET:-qaira-testengine-dev-secret}
      MOBILE_ENGINE_URL: ${MOBILE_ENGINE_URL:-http://mobile-engine:4312}
      TESTENGINE_POLL_INTERVAL_MS: ${TESTENGINE_ANDROID_POLL_INTERVAL_MS:-1000}
      TESTENGINE_POLL_CONCURRENCY: ${TESTENGINE_ANDROID_POLL_CONCURRENCY:-1}
      ARTIFACT_ROOT: ${ARTIFACT_ROOT:-/artifacts}
      RECORDER_HEADLESS: ${RECORDER_HEADLESS:-true}
    volumes:
      - qaira-local-testengine-artifacts:/artifacts
    depends_on:
      api:
        condition: service_healthy
      mobile-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:4301/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      replicas: ${TESTENGINE_ANDROID_REPLICAS:-0}

  testengine:
    image: haproxy:2.9-alpine
    container_name: qaira-local-testengine
    ports:
      - "${TESTENGINE_PORT:-4301}:4301"
    volumes:
      - ./testengine-gateway/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:4301/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  mobile-engine:
    image: ${QAIRA_MOBILE_ENGINE_IMAGE:-jayarajumetta/qaira-mobile-engine:latest}
    container_name: qaira-local-mobile-engine
    ports:
      - "${MOBILE_ENGINE_PORT:-4312}:4312"
    environment:
      PORT: 4312
      APPIUM_SERVER_URL: ${APPIUM_SERVER_URL:-http://host.docker.internal:4723}
      ANDROID_DEVICE_NAME: ${ANDROID_DEVICE_NAME:-Android Device}
      ANDROID_PLATFORM_VERSION: ${ANDROID_PLATFORM_VERSION:-}
      ANDROID_APP: ${ANDROID_APP:-}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4312/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  qaira-local-postgres-data:
  qaira-local-testengine-artifacts:
  qaira-local-minio-data:
