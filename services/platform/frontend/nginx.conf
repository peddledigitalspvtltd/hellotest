server {
  listen 80;
  server_name _;
  absolute_redirect off;
  client_max_body_size 128m;
  proxy_buffering off;
  resolver 127.0.0.11 valid=30s ipv6=off;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    add_header Cache-Control "no-store";
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /admin {
    return 302 /admin/;
  }

  location /admin/ {
    proxy_pass http://127.0.0.1:81/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api {
    set $api_upstream api:3000;
    proxy_pass http://$api_upstream/$is_args$args;
    proxy_connect_timeout 5s;
    proxy_http_version 1.1;
    proxy_read_timeout 210s;
    proxy_send_timeout 210s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    set $api_upstream api:3000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$api_upstream;
    proxy_connect_timeout 5s;
    proxy_http_version 1.1;
    proxy_read_timeout 210s;
    proxy_send_timeout 210s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /jaeger {
    return 302 /jaeger/;
  }

  location /jaeger/ {
    set $jaeger_upstream jaeger:16686;
    # Jaeger serves at / and its UI detects the browser's /jaeger/ prefix.
    rewrite ^/jaeger/(.*)$ /$1 break;
    proxy_pass http://$jaeger_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /testengine/ {
    set $testengine_upstream testengine:4301;
    rewrite ^/testengine/(.*)$ /$1 break;
    proxy_pass http://$testengine_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /runtime-config.js {
    add_header Cache-Control "no-store";
  }
}

