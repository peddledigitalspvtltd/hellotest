resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 3s;
client_max_body_size 128m;
proxy_connect_timeout 3s;
proxy_read_timeout 210s;
proxy_send_timeout 210s;
proxy_http_version 1.1;
proxy_buffering off;
proxy_next_upstream off;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

location ~ ^/services/(platform|testing|knowledge|manual|dashboard|automation|agentic|chatbot|ai|trace|integration)/ {
  set $service_upstream $1-api:3000;
  rewrite ^/services/[^/]+(/.*)$ $1 break;
  proxy_pass http://$service_upstream;
}
location /services/ { return 404; }
location = /api { return 308 /api/; }
location /api/ops-telemetry/ {
  set $trace_upstream trace-api:3000;
  rewrite ^/api(/.*)$ $1 break;
  proxy_pass http://$trace_upstream;
}
location /api/ {
  set $platform_upstream platform-api:3000;
  rewrite ^/api(/.*)$ $1 break;
  proxy_pass http://$platform_upstream;
}
location /testengine/ {
  set $engine_upstream testengine-backend:4301;
  rewrite ^/testengine(/.*)$ $1 break;
  proxy_pass http://$engine_upstream;
}
location = /jaeger { return 302 /jaeger/; }
location /jaeger/ {
  set $jaeger_upstream jaeger:16686;
  rewrite ^/jaeger/(.*)$ /$1 break;
  proxy_pass http://$jaeger_upstream;
}
