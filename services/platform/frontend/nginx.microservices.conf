# DNS is resolved per request so an absent optional API cannot stop the UI.
server {
  listen 80;
  server_name _;
  absolute_redirect off;
  root /usr/share/nginx/html;
  index index.html;
  include /etc/nginx/hellotest-service-locations.conf;

  location = /admin { return 302 /admin/; }
  location /admin/ {
    proxy_pass http://127.0.0.1:81/;
    proxy_set_header Host $host;
  }
  location / { add_header Cache-Control "no-store"; try_files $uri $uri/ /index.html; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location = /runtime-config.js { add_header Cache-Control "no-store"; }
}

server {
  listen 81;
  server_name _;
  absolute_redirect off;
  root /usr/share/nginx/admin;
  index admin.html;
  include /etc/nginx/hellotest-service-locations.conf;

  location / { add_header Cache-Control "no-store"; try_files $uri $uri/ /admin.html; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location = /runtime-config.js { add_header Cache-Control "no-store"; }
}
