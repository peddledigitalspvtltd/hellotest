apiVersion: v1
kind: ConfigMap
metadata:
  name: hellotest-testengine-config
data:
  PORT: "4301"
  NODE_ENV: "production"
  TESTENGINE_QUEUE_REQUIRED: "true"
  HELLOTEST_API_BASE_URL: "http://hellotest-api:3000"
  ENGINE_PUBLIC_URL: "http://hellotest-testengine-web:4301"
  TESTENGINE_API_POLL_CONCURRENCY: "8"
  TESTENGINE_WEB_POLL_CONCURRENCY: "2"
  TESTENGINE_ANDROID_POLL_CONCURRENCY: "1"
  TESTENGINE_API_MAX_WORKERS: "10"
  TESTENGINE_WEB_MAX_WORKERS: "5"
  TESTENGINE_ANDROID_MAX_WORKERS: "2"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hellotest-testengine-api
  labels:
    app: hellotest-testengine
    engine-class: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hellotest-testengine
      engine-class: api
  template:
    metadata:
      labels:
        app: hellotest-testengine
        engine-class: api
    spec:
      terminationGracePeriodSeconds: 40
      containers:
        - name: worker
          image: hellotest-testengine:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: hellotest-testengine-config
          env:
            - name: ENGINE_NAME
              value: hellotest-testengine-api
            - name: TESTENGINE_WORKER_CLASS
              value: api
            - name: TESTENGINE_POLL_INTERVAL_MS
              value: "1000"
            - name: TESTENGINE_POLL_CONCURRENCY
              valueFrom:
                configMapKeyRef:
                  name: hellotest-testengine-config
                  key: TESTENGINE_API_POLL_CONCURRENCY
            - name: HELLOTEST_TESTENGINE_SECRET
              valueFrom:
                secretKeyRef:
                  name: hellotest-testengine-secret
                  key: shared-secret
          ports:
            - containerPort: 4301
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 4301
            timeoutSeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 4301
            timeoutSeconds: 3
            periodSeconds: 15
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hellotest-testengine-web
  labels:
    app: hellotest-testengine
    engine-class: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hellotest-testengine
      engine-class: web
  template:
    metadata:
      labels:
        app: hellotest-testengine
        engine-class: web
    spec:
      terminationGracePeriodSeconds: 40
      containers:
        - name: worker
          image: hellotest-testengine:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: hellotest-testengine-config
          env:
            - name: ENGINE_NAME
              value: hellotest-testengine-web
            - name: TESTENGINE_WORKER_CLASS
              value: web
            - name: TESTENGINE_POLL_INTERVAL_MS
              value: "1000"
            - name: TESTENGINE_POLL_CONCURRENCY
              valueFrom:
                configMapKeyRef:
                  name: hellotest-testengine-config
                  key: TESTENGINE_WEB_POLL_CONCURRENCY
            - name: HELLOTEST_TESTENGINE_SECRET
              valueFrom:
                secretKeyRef:
                  name: hellotest-testengine-secret
                  key: shared-secret
          ports:
            - containerPort: 4301
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 4301
            timeoutSeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 4301
            timeoutSeconds: 3
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: hellotest-testengine-web
spec:
  selector:
    app: hellotest-testengine
    engine-class: web
  ports:
    - name: http
      port: 4301
      targetPort: 4301
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hellotest-testengine-android
  labels:
    app: hellotest-testengine
    engine-class: android
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hellotest-testengine
      engine-class: android
  template:
    metadata:
      labels:
        app: hellotest-testengine
        engine-class: android
    spec:
      terminationGracePeriodSeconds: 40
      containers:
        - name: worker
          image: hellotest-testengine:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: hellotest-testengine-config
          env:
            - name: ENGINE_NAME
              value: hellotest-testengine-android
            - name: TESTENGINE_WORKER_CLASS
              value: android
            - name: MOBILE_ENGINE_URL
              value: "http://hellotest-mobile-engine:4312"
            - name: MOBILE_ENGINE_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: hellotest-mobile-engine-secret
                  key: shared-secret
            - name: TESTENGINE_POLL_INTERVAL_MS
              value: "1000"
            - name: TESTENGINE_POLL_CONCURRENCY
              valueFrom:
                configMapKeyRef:
                  name: hellotest-testengine-config
                  key: TESTENGINE_ANDROID_POLL_CONCURRENCY
            - name: HELLOTEST_TESTENGINE_SECRET
              valueFrom:
                secretKeyRef:
                  name: hellotest-testengine-secret
                  key: shared-secret
          ports:
            - containerPort: 4301
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 4301
            timeoutSeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 4301
            timeoutSeconds: 3
            periodSeconds: 15
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hellotest-mobile-engine
  labels:
    app: hellotest-mobile-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hellotest-mobile-engine
  template:
    metadata:
      labels:
        app: hellotest-mobile-engine
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: mobile-engine
          image: hellotest-mobile-engine:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "4312"
            - name: NODE_ENV
              value: production
            - name: MOBILE_ENGINE_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: hellotest-mobile-engine-secret
                  key: shared-secret
            - name: MOBILE_PROVIDER
              value: local-appium
            - name: APPIUM_SERVER_URL
              value: "http://appium:4723"
            - name: MOBILE_REQUIRE_PROVIDER_READY
              value: "false"
          ports:
            - containerPort: 4312
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 4312
            timeoutSeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 4312
            timeoutSeconds: 3
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: hellotest-mobile-engine
spec:
  selector:
    app: hellotest-mobile-engine
  ports:
    - name: http
      port: 4312
      targetPort: 4312
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hellotest-testengine-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hellotest-testengine-api
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hellotest-testengine-web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hellotest-testengine-web
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hellotest-testengine-android
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hellotest-testengine-android
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
