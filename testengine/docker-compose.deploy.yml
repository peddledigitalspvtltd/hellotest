x-testengine-worker: &testengine-worker
  image: ${HELLOTEST_TESTENGINE_IMAGE:-jayarajumetta/hellotest-testengine:latest}
  environment: &testengine-env
    PORT: 4301
    NODE_ENV: production
    ARTIFACT_ROOT: /artifacts
    HELLOTEST_API_BASE_URL: ${HELLOTEST_API_BASE_URL:-http://host.docker.internal:3000}
    HELLOTEST_TESTENGINE_SECRET: ${HELLOTEST_TESTENGINE_SECRET:?HELLOTEST_TESTENGINE_SECRET must be set to a non-default value of at least 32 characters}
    MOBILE_ENGINE_SHARED_SECRET: ${MOBILE_ENGINE_SHARED_SECRET:?MOBILE_ENGINE_SHARED_SECRET must be set to a non-default value of at least 32 characters}
    ENGINE_PUBLIC_URL: ${ENGINE_PUBLIC_URL:-http://localhost:4301}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    TESTENGINE_CORS_ORIGINS: ${TESTENGINE_CORS_ORIGINS:-}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    OPS_TELEMETRY_ENABLED: ${OPS_TELEMETRY_ENABLED:-true}
    OPS_TELEMETRY_EVENTS_PATH: ${OPS_TELEMETRY_EVENTS_PATH:-/api/v1/events}
    OPS_TELEMETRY_BOARD_PATH: ${OPS_TELEMETRY_BOARD_PATH:-/ops-telemetry}
    OPS_TELEMETRY_ENVIRONMENT: ${OPS_TELEMETRY_ENVIRONMENT:-production}
    OPS_TELEMETRY_STORE_PATH: ${OPS_TELEMETRY_STORE_PATH:-/artifacts/ops-telemetry-events.ndjson}
    OPS_TELEMETRY_MAX_EVENTS: ${OPS_TELEMETRY_MAX_EVENTS:-2000}
    OPS_TELEMETRY_API_KEY: ${OPS_TELEMETRY_API_KEY:-}
    OPS_TELEMETRY_API_KEY_HEADER: ${OPS_TELEMETRY_API_KEY_HEADER:-Authorization}
    OPS_TELEMETRY_API_KEY_PREFIX: ${OPS_TELEMETRY_API_KEY_PREFIX:-Bearer}
  volumes:
    - testengine-artifacts:/artifacts
  healthcheck:
    test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4301/health/ready').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));\""]
    interval: 15s
    timeout: 10s
    retries: 10
  stop_grace_period: 35s
  restart: always

services:
  testengine-api:
    <<: *testengine-worker
    environment:
      <<: *testengine-env
      ENGINE_NAME: HelloTest API Execution Engine
      TESTENGINE_WORKER_CLASS: api
      TESTENGINE_POLL_INTERVAL_MS: ${TESTENGINE_API_POLL_INTERVAL_MS:-1000}
      TESTENGINE_POLL_CONCURRENCY: ${TESTENGINE_API_POLL_CONCURRENCY:-8}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME_API:-hellotest-testengine-api}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES_API:-service.name=hellotest-testengine-api}
      OPS_TELEMETRY_SERVICE_NAME: ${OPS_TELEMETRY_SERVICE_NAME_API:-hellotest-testengine-api}

  testengine-web:
    <<: *testengine-worker
    container_name: hellotest-testengine-web
    environment:
      <<: *testengine-env
      ENGINE_NAME: HelloTest Web Execution Engine
      TESTENGINE_WORKER_CLASS: web
      TESTENGINE_POLL_INTERVAL_MS: ${TESTENGINE_WEB_POLL_INTERVAL_MS:-1000}
      TESTENGINE_POLL_CONCURRENCY: ${TESTENGINE_WEB_POLL_CONCURRENCY:-2}
      SELENIUM_GRID_URL: ${SELENIUM_GRID_URL:-http://selenium-hub:4444/wd/hub}
      SELENIUM_VNC_PORT: ${SELENIUM_VNC_PORT:-7900}
      SELENIUM_LIVE_VIEW_URL: ${SELENIUM_LIVE_VIEW_URL:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME_WEB:-hellotest-testengine-web}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES_WEB:-service.name=hellotest-testengine-web}
      OPS_TELEMETRY_SERVICE_NAME: ${OPS_TELEMETRY_SERVICE_NAME_WEB:-hellotest-testengine-web}
    ports:
      - "${TESTENGINE_BIND:-0.0.0.0}:${TESTENGINE_PORT:-4301}:4301"
    depends_on:
      - selenium-hub
      - selenium-node-chrome

  testengine-android:
    <<: *testengine-worker
    environment:
      <<: *testengine-env
      ENGINE_NAME: HelloTest Android Execution Engine
      TESTENGINE_WORKER_CLASS: android
      MOBILE_ENGINE_URL: ${MOBILE_ENGINE_URL:-http://mobile-engine:4312}
      TESTENGINE_POLL_INTERVAL_MS: ${TESTENGINE_ANDROID_POLL_INTERVAL_MS:-1000}
      TESTENGINE_POLL_CONCURRENCY: ${TESTENGINE_ANDROID_POLL_CONCURRENCY:-1}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME_ANDROID:-hellotest-testengine-android}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES_ANDROID:-service.name=hellotest-testengine-android}
      OPS_TELEMETRY_SERVICE_NAME: ${OPS_TELEMETRY_SERVICE_NAME_ANDROID:-hellotest-testengine-android}
    depends_on:
      mobile-engine:
        condition: service_healthy

  mobile-engine:
    image: ${HELLOTEST_MOBILE_ENGINE_IMAGE:-jayarajumetta/hellotest-mobile-engine:latest}
    container_name: hellotest-mobile-engine
    ports:
      - "${MOBILE_ENGINE_BIND:-127.0.0.1}:${MOBILE_ENGINE_PORT:-4312}:4312"
    environment:
      PORT: 4312
      NODE_ENV: production
      MOBILE_ENGINE_SHARED_SECRET: ${MOBILE_ENGINE_SHARED_SECRET:?MOBILE_ENGINE_SHARED_SECRET must be set to a non-default value of at least 32 characters}
      MOBILE_PROVIDER: ${MOBILE_PROVIDER:-local-appium}
      MOBILE_REMOTE_URL: ${MOBILE_REMOTE_URL:-}
      APPIUM_SERVER_URL: ${APPIUM_SERVER_URL:-http://host.docker.internal:4723}
      MOBILE_REQUIRE_PROVIDER_READY: ${MOBILE_REQUIRE_PROVIDER_READY:-false}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4312/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 15s
    restart: always

  selenium-hub:
    image: ${HELLOTEST_SELENIUM_HUB_IMAGE:-selenium/hub:4.22.0}
    container_name: hellotest-selenium-hub
    ports:
      - "${SELENIUM_GRID_BIND:-127.0.0.1}:${SELENIUM_GRID_PORT:-4444}:4444"
    restart: always

  selenium-node-chrome:
    image: ${HELLOTEST_SELENIUM_NODE_IMAGE:-selenium/node-chromium:4.22.0}
    container_name: hellotest-selenium-node-chrome
    shm_size: 2gb
    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: 4442
      SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
      SE_NODE_MAX_SESSIONS: 1
      SE_VNC_NO_PASSWORD: ${SE_VNC_NO_PASSWORD:-1}
    ports:
      - "${SELENIUM_VNC_BIND:-127.0.0.1}:${SELENIUM_VNC_PORT:-7900}:7900"
    depends_on:
      - selenium-hub
    restart: always

volumes:
  testengine-artifacts:
